<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>奶茶猫咪小庭院 · 软萌挂机收集小游戏</title>
<style>
  :root {
    --milktea-bg: #F7EFE5;
    --milktea-card: #FFFBF6;
    --milktea-warm: #EEDCC8;
    --milktea-border: #DFC8B0;
    --pink: #FFD6E0;
    --pink-deep: #F48FB1;
    --blue: #D4ECFA;
    --blue-deep: #7BBCE8;
    --mint: #CCF0E1;
    --mint-deep: #62C3A0;
    --teal: #A8E0DC;
    --teal-deep: #4BA8A4;
    --text: #5A463C;
    --text-soft: #8B7366;
    --dot-trash: #C2C2C2;
    --dot-t1: #8CE0B5;
    --dot-t2: #8AC4F8;
    --dot-t3: #46D2C8;
    --dot-gear: #FFB085;
    --dot-bp: #F4C45D;
    --shadow: 0 6px 20px rgba(120, 90, 68, 0.12);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--milktea-bg); color: var(--text);
  }
  input, textarea, select { user-select: text; font-family: inherit; }
  button {
    font-family: inherit; cursor: pointer; border: none; outline: none;
    transition: transform 0.12s ease, filter 0.15s ease; color: var(--text);
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.48; cursor: not-allowed; transform: none; }

  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* ==================== GARDEN VIEW & BEAUTIFUL THEMES ==================== */
  #garden-view {
    position: relative; width: 100%; height: 100%;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background-size: cover; background-position: center;
  }
  #garden-view::-webkit-scrollbar { display: none; }
  /* Polished Soft-Glass UI Enhancements */
  .pill-btn, .status-strip, #mini-gacha-pill, .hud-bottom, .gacha-toast {
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(112, 82, 60, 0.11), inset 0 1px 0 rgba(255,255,255,0.75);
  }
  .item-card {
    box-shadow: 0 3px 10px rgba(112, 82, 60, 0.06);
    transition: transform 0.14s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .item-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 16px rgba(112, 82, 60, 0.11);
  }
  .modal-box {
    box-shadow: 0 18px 46px rgba(72, 50, 38, 0.24), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .expand-banner {
    background: linear-gradient(135deg, #FFF5F8, #EFFBF6);
    border: 1.5px solid var(--pink-deep);
    border-radius: 15px; padding: 9px 12px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12px;
  }
  body.night-mode .expand-banner {
    background: linear-gradient(135deg, #3D2E35, #2A3B36);
    border-color: #7D5566;
  }
  .cat-tree-unit {
    position: absolute; bottom: calc(64px + var(--safe-b)); width: 148px; height: 126px;
    pointer-events: auto; cursor: pointer; z-index: 60;
  }
  body.ui-mobile .cat-tree-unit { transform: scale(0.84); transform-origin: bottom center; }
  #garden-world {
    position: relative; width: 560px; min-width: 100%; height: 100%; transition: width 0.35s ease;
    overflow: hidden;
  }
  #garden-world.bg-mint {
    background: linear-gradient(180deg, #CBEBFB 0%, #E7F6F3 28%, #E0F3D5 28%, #D3ECC3 77%, #EFE2D1 77%, #E6D3BC 100%);
  }
  #garden-world.bg-sakura {
    background: linear-gradient(180deg, #FFD9E4 0%, #FFEBD9 28%, #F3E5D8 28%, #E7D5C9 77%, #EFE0D8 77%, #E2CBBF 100%);
  }
  #garden-world.bg-milktea {
    background: linear-gradient(180deg, #FCEAD5 0%, #FFF4E6 28%, #F4E3CE 28%, #E9D2B8 77%, #E6CCB2 77%, #D8BA9E 100%);
  }
  #garden-world.bg-starry {
    background: linear-gradient(180deg, #3D4E7A 0%, #6D87AD 28%, #547F7A 28%, #476E6C 77%, #827682 77%, #6B606E 100%);
  }
  #garden-world.bg-seaside {
    background: linear-gradient(180deg, #FFDDE6 0%, #CBE7FA 22%, #9BD6EA 22%, #CBEBF2 34%, #E6F2D9 34%, #D4E8C4 77%, #F2E3CE 77%, #E4D0B6 100%);
  }
  #garden-world.bg-winter {
    background: linear-gradient(180deg, #D5EAFA 0%, #EFF7FC 28%, #E8F3F5 28%, #D6E9ED 77%, #EAE4DF 77%, #DCD4CD 100%);
  }
  #garden-world.bg-custom {
    background-color: #EFE5D8; background-size: cover; background-position: center;
  }
  #garden-world.bg-custom #bg-scenic-svg { display: none; }
  .pan-hint {
    position: fixed; bottom: calc(64px + var(--safe-b)); left: 10px; z-index: 180;
    background: rgba(255,251,246,0.9); border: 1.5px solid var(--milktea-border);
    border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 2px 8px rgba(90,70,60,0.09);
  }
  .pan-hint button {
    background: var(--milktea-warm); border-radius: 50%; width: 22px; height: 22px;
    font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
  }
  body.night-mode .pan-hint { background: rgba(52,43,39,0.92); color: var(--text); border-color: var(--milktea-border); }
  /* 6 Built-in Aesthetic Themes */
  #garden-view.bg-mint {
    background: linear-gradient(180deg, #CBEBFB 0%, #E7F6F3 28%, #E0F3D5 28%, #D3ECC3 77%, #EFE2D1 77%, #E6D3BC 100%);
  }
  #garden-view.bg-sakura {
    background: linear-gradient(180deg, #FFD9E4 0%, #FFEBD9 28%, #F3E5D8 28%, #E7D5C9 77%, #EFE0D8 77%, #E2CBBF 100%);
  }
  #garden-view.bg-milktea {
    background: linear-gradient(180deg, #FCEAD5 0%, #FFF4E6 28%, #F4E3CE 28%, #E9D2B8 77%, #E6CCB2 77%, #D8BA9E 100%);
  }
  #garden-view.bg-starry {
    background: linear-gradient(180deg, #475B8A 0%, #7B95B8 28%, #5D8B86 28%, #4F7876 77%, #8D818C 77%, #736875 100%);
  }
  #garden-view.bg-seaside {
    background: linear-gradient(180deg, #FFDDE6 0%, #CBE7FA 22%, #9BD6EA 22%, #CBEBF2 34%, #E6F2D9 34%, #D4E8C4 77%, #F2E3CE 77%, #E4D0B6 100%);
  }
  #garden-view.bg-winter {
    background: linear-gradient(180deg, #D5EAFA 0%, #EFF7FC 28%, #E8F3F5 28%, #D6E9ED 77%, #EAE4DF 77%, #DCD4CD 100%);
  }
  #garden-view.bg-custom {
    background-color: #EFE5D8;
  }

  /* Ambient Scenic Layer (petals, stars, sunbeams, snow) */
  #bg-scenic-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 3;
  }
  #garden-view.bg-custom #bg-scenic-svg { display: none; }
  #ambient-layer {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 8;
  }
  .amb-particle {
    position: absolute; pointer-events: none;
    animation: ambFall linear infinite;
  }
  @keyframes ambFall {
    0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
    15% { opacity: 0.85; }
    85% { opacity: 0.85; }
    100% { transform: translateY(105vh) translateX(40px) rotate(260deg); opacity: 0; }
  }
  .amb-twinkle {
    position: absolute; border-radius: 50%; background: #FFF8D6;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 0.95; transform: scale(1.25); }
  }
  .sunbeam {
    position: absolute; top: -10%; left: 12%; width: 220px; height: 120%;
    background: linear-gradient(180deg, rgba(255,250,220,0.28), transparent 70%);
    transform: rotate(-18deg); pointer-events: none;
  }
  .sky-moon {
    position: absolute; top: 10%; right: 18%; width: 42px; height: 42px; border-radius: 50%;
    background: #FFF6CC; box-shadow: 0 0 24px rgba(255, 246, 204, 0.75);
  }
  .sky-clouds {
    position: absolute; top: 0; left: 0; width: 100%; height: 28%;
    pointer-events: none; overflow: hidden; z-index: 5;
  }
  .cloud {
    position: absolute; background: rgba(255, 255, 255, 0.82);
    border-radius: 999px; animation: cloudDrift linear infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 55%; height: 140%; top: -55%; left: 16%; }
  .cloud::after { width: 42%; height: 115%; top: -35%; right: 16%; }
  @keyframes cloudDrift {
    from { transform: translateX(-140px); }
    to { transform: translateX(calc(100vw + 160px)); }
  }

  .garden-fence {
    position: absolute; left: 0; right: 0; top: 75.5%; height: 22px;
    background: repeating-linear-gradient(90deg, rgba(255,247,238,0.92) 0 18px, rgba(230,209,186,0.92) 18px 20px, transparent 20px 30px);
    border-top: 3px solid #DFC4A6; border-bottom: 3px solid #D3B492;
    pointer-events: none; z-index: 40;
  }

  #garden-stage {
    position: absolute; left: 0; right: 0; top: 24%; bottom: 24%; overflow: hidden; z-index: 20;
  }
  #garden-stage.edit-mode {
    background-image:
      linear-gradient(to right, rgba(160, 128, 100, 0.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(160, 128, 100, 0.18) 1px, transparent 1px);
    background-size: 36px 36px;
  }

  .yard-item {
    position: absolute; transform: translate(-50%, -80%);
    cursor: pointer; touch-action: none; transition: filter 0.15s;
  }
  .yard-item.dragging { filter: drop-shadow(0 10px 14px rgba(90,70,60,0.3)); z-index: 999 !important; }
  .yard-item.selected-furn { filter: drop-shadow(0 0 0 3px #F48FB1); }
  .yard-item .inner-flip { transition: transform 0.18s; }
  .yard-item.flipped .inner-flip { transform: scaleX(-1); }

  .yard-cat {
    position: absolute; transform: translate(-50%, -85%);
    cursor: pointer; transition: left 2.4s ease-in-out, top 2.4s ease-in-out;
  }
  .yard-cat.resting { transition: none; }
  .cat-bob { animation: catBob 2.6s ease-in-out infinite; }
  @keyframes catBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* Speech Bubble - wraps cleanly & never clipped on mobile */
  .speech-bubble {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: rgba(255, 251, 246, 0.97); border: 1.5px solid var(--milktea-border);
    padding: 4px 9px; border-radius: 12px; font-size: 11px; line-height: 1.35;
    width: max-content; max-width: 170px; white-space: normal; text-align: center;
    box-shadow: 0 4px 10px rgba(90,70,60,0.14); pointer-events: none;
    animation: popFade 4s ease forwards; z-index: 500;
  }
  @keyframes popFade {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(0.92); }
    12% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    82% { opacity: 1; transform: translate(-50%, -2px); }
    100% { opacity: 0; transform: translate(-50%, -8px); }
  }
  .float-coin {
    position: absolute; left: 50%; top: -8px; transform: translateX(-50%);
    font-size: 12px; font-weight: 700; color: #D98A2B;
    background: rgba(255,250,235,0.96); padding: 2px 7px; border-radius: 10px;
    border: 1px solid #F2D28B; pointer-events: none; white-space: nowrap;
    animation: floatUp 1.5s ease-out forwards; z-index: 600;
  }
  @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -34px); } }

  /* Furniture Edit Floating Bar */
  #furn-toolbar {
    position: fixed; display: none; gap: 6px; padding: 6px 10px;
    background: rgba(255, 251, 246, 0.98); border: 2px solid var(--pink-deep);
    border-radius: 14px; box-shadow: var(--shadow); z-index: 900;
  }
  #furn-toolbar.show { display: flex; }
  #furn-toolbar button { font-size: 12px; padding: 5px 9px; border-radius: 9px; background: var(--milktea-warm); font-weight: 700; }
  #furn-toolbar button.danger { background: #FFD6D6; color: #A64242; }

  /* External Cat Tree & Sidewalk */
  #sidewalk-zone {
    position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
    pointer-events: none; z-index: 45; overflow: visible;
  }
  #cat-tree-widget {
    position: absolute; left: 920px; bottom: calc(64px + var(--safe-b)); width: 148px; height: 126px;
    pointer-events: auto; cursor: pointer; z-index: 60;
  }
  .tree-slot {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,251,246,0.72); border: 1.5px dashed var(--milktea-border);
  }
  .tree-slot.filled { background: transparent; border: none; }
  .tree-slot-0 { left: 52px; top: 2px; }
  .tree-slot-1 { left: 8px; top: 42px; }
  .tree-slot-2 { right: 8px; top: 50px; }
  .tree-label {
    position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
    background: rgba(255,251,246,0.94); border: 1px solid var(--milktea-border);
    border-radius: 10px; padding: 1px 8px; font-size: 10px; white-space: nowrap; font-weight: 700;
  }

  /* Passersby Layer - overflow: visible so speech bubbles NEVER clip on mobile! */
  #passerby-layer {
    position: absolute; left: 0; right: 0; bottom: calc(58px + var(--safe-b)); height: 64px;
    pointer-events: none; overflow: visible; z-index: 80;
  }
  .passerby {
    position: absolute; bottom: 2px; left: -60px; width: 48px; height: 56px;
    transition: left 4.2s linear; overflow: visible;
  }

  /* ==================== HUD (RESPONSIVE + MOBILE/DESKTOP MODE) ==================== */
  .hud-top-left {
    position: fixed; top: 10px; left: 10px; z-index: 200;
    display: flex; flex-direction: column; gap: 6px; max-width: 56vw;
  }
  .hud-top-right {
    position: fixed; top: 10px; right: 10px; z-index: 200;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  .nav-pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill-btn {
    background: rgba(255, 251, 246, 0.95); border: 1.5px solid var(--milktea-border);
    border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700;
    box-shadow: 0 3px 10px rgba(90,70,60,0.09);
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .pill-btn.pink { background: var(--pink); border-color: #F4B3C4; }
  .pill-btn.blue { background: var(--blue); border-color: #AED7F2; }
  .pill-btn.mint { background: var(--mint); border-color: #9ADBC1; }
  .pill-btn.teal { background: var(--teal); border-color: #7AC7C2; }

  .status-strip {
    display: inline-flex; flex-wrap: wrap; align-items: center; gap: 7px;
    background: rgba(255, 251, 246, 0.94); border: 1.5px solid var(--milktea-border);
    border-radius: 14px; padding: 4px 10px; font-size: 11px; font-weight: 700;
    box-shadow: 0 3px 10px rgba(90,70,60,0.08); width: fit-content;
  }
  .exp-bar-mini { width: 46px; height: 6px; background: var(--milktea-warm); border-radius: 999px; overflow: hidden; }
  .exp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--mint-deep), var(--teal-deep)); width: 0%; transition: width 0.3s; }

  .theme-badge {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: rgba(255, 243, 248, 0.95); border: 1.5px solid #F4B3C4; color: #A64D6B;
    width: fit-content; display: none;
  }
  .theme-badge.show { display: inline-block; }

  .badge-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #FF6B93; margin-left: 2px; animation: pulseDot 1.3s infinite;
  }
  @keyframes pulseDot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }

  #active-buffs-bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 210px; }
  .buff-chip {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: rgba(255, 247, 232, 0.96); border: 1.5px solid #F2C97D;
  }

  #mini-gacha-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,251,246,0.94); border: 1.5px solid var(--milktea-border);
    border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700; cursor: pointer; width: fit-content;
  }
  .mini-progress { width: 40px; height: 6px; background: var(--milktea-warm); border-radius: 999px; overflow: hidden; }
  .mini-progress-fill { height: 100%; background: var(--pink-deep); transition: width 0.2s linear; }

  /* Bottom Bar - Desktop Floating Pill vs Mobile Full Dock */
  .hud-bottom {
    position: fixed; bottom: calc(8px + var(--safe-b)); left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; gap: 6px; padding: 6px 10px;
    background: rgba(255, 251, 246, 0.95); border: 1.5px solid var(--milktea-border);
    border-radius: 999px; box-shadow: var(--shadow); max-width: 97vw; overflow-x: auto;
  }
  .hud-bottom .pill-btn { box-shadow: none; padding: 6px 10px; font-size: 12px; }

  /* Mobile UI Mode Overrides */
  body.ui-mobile .hud-bottom {
    left: 0; right: 0; bottom: 0; transform: none; max-width: 100%;
    border-radius: 18px 18px 0 0; border-bottom: none;
    padding: 7px 6px calc(7px + var(--safe-b));
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
  }
  body.ui-mobile .hud-bottom .pill-btn {
    flex-direction: column; justify-content: center; gap: 2px;
    padding: 6px 2px; border-radius: 12px; font-size: 10px; min-height: 46px;
  }
  body.ui-mobile #cat-tree-widget { right: 6px; transform: scale(0.84); transform-origin: bottom right; bottom: calc(64px + var(--safe-b)); }
  body.ui-mobile #furn-toolbar {
    left: 50% !important; top: auto !important; bottom: calc(66px + var(--safe-b)) !important; transform: translateX(-50%);
  }

  /* ==================== TOP AUTO-DISMISSING GACHA TOAST ==================== */
  #gacha-toast-wrap {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 450; display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none; width: min(310px, 84vw);
  }
  .gacha-toast {
    pointer-events: auto; cursor: pointer; position: relative; touch-action: none;
    width: 100%; background: rgba(255, 251, 246, 0.98);
    border: 2px solid var(--milktea-border); border-radius: 16px;
    padding: 8px 14px 8px 10px; box-shadow: 0 8px 24px rgba(90,70,60,0.16);
    display: flex; align-items: center; gap: 10px;
    animation: toastIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  }
  .gacha-toast.hiding { animation: toastOut 0.24s ease forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-18px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-14px) scale(0.95); } }

  .rarity-dot {
    position: absolute; top: 8px; right: 9px; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid #FFF; box-shadow: 0 1px 4px rgba(0,0,0,0.16);
  }
  .rarity-dot.shimmer {
    background: linear-gradient(135deg, #48D1CC, #FFAED6, #89CFF0, #FFE082) !important;
    animation: dotGlow 1.8s linear infinite;
  }
  @keyframes dotGlow { 0%, 100% { box-shadow: 0 0 6px rgba(72,209,204,0.8); } 50% { box-shadow: 0 0 12px rgba(255,174,214,0.95); } }

  /* ==================== GACHA-ONLY MINIMAL VIEW ==================== */
  #gacha-only-view {
    position: fixed; inset: 0; z-index: 300; background: var(--milktea-bg);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 16px 22px; overflow-y: auto;
  }
  #gacha-only-view.active { display: flex; }
  .gacha-only-top {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: center; z-index: 310;
  }
  .gacha-stage-card {
    width: min(420px, 94vw); background: var(--milktea-card);
    border: 2px solid var(--milktea-border); border-radius: 26px;
    padding: 18px 18px; box-shadow: var(--shadow); text-align: center; position: relative;
  }
  .yarn-bar-wrap { width: 100%; height: 13px; background: var(--milktea-warm); border-radius: 999px; overflow: hidden; margin: 9px 0 5px; }
  .yarn-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pink-deep), var(--blue-deep), var(--mint-deep)); border-radius: 999px; transition: width 0.2s linear; }
  .gacha-showcase {
    min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #FDF7F0; border: 1.5px dashed var(--milktea-border); border-radius: 20px;
    padding: 12px; margin: 10px 0; position: relative;
  }

<script>
(() => {
  'use strict';

  /* ================================================================
     1. SOUND & HAPTICS
     ================================================================ */
  const SFX = {
    ctx: null, enabled: true, volume: 0.7,
    ensure() {
      if (!this.enabled || this.volume <= 0) return null;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return this.ctx;
    },
    tone(freq, dur, type = 'sine', baseVol = 0.08, slideTo = null) {
      const ctx = this.ensure();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const vol = baseVol * this.volume;
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + dur + 0.02);
    },
    pop() { this.tone(520, 0.09, 'sine', 0.07, 740); },
    coin() { this.tone(880, 0.09, 'triangle', 0.07); setTimeout(() => this.tone(1180, 0.14, 'triangle', 0.07), 70); },
    meow() { this.tone(620, 0.14, 'sine', 0.07, 880); setTimeout(() => this.tone(860, 0.16, 'sine', 0.06, 540), 110); },
    rare() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.16, 'triangle', 0.07), i * 75)); },
    craft() { this.tone(440, 0.1, 'triangle', 0.07, 660); setTimeout(() => this.tone(660, 0.16, 'sine', 0.08, 880), 90); }
  };
  function vibrate(ms = 22) {
    if (state.settings.haptics && navigator.vibrate) {
      try { navigator.vibrate(ms); } catch {}
    }
  }

  /* ================================================================
     2. 3-TIER MATERIAL SYSTEM: 10 T1 TRASH -> 36 T2 BASE -> 10 T3 ADV
     ================================================================ */
  const DOT_COLORS = {
    trash: '#C2C2C2', t1: '#8CE0B5', t2: '#8AC4F8', t3: '#46D2C8', t4: '#B87CFF', gear: '#FFB085', bp: '#F4C45D', food: '#FF7E8A'

  // Deterministic full mapping for ALL 55 T1+T1 pairs (same-type & cross-type) -> 36 T2 materials
  function buildT1RecipeMap() {
    const map = {};
    const ids = T1_TRASH.map(t => t.id);
    const pairs = [];
    for (let i = 0; i < ids.length; i++) {
      for (let j = i; j < ids.length; j++) {
        pairs.push([ids[i], ids[j]].sort().join('+'));
      }
    }
    pairs.forEach((p, idx) => {
      map[p] = T2_MATERIALS[idx % T2_MATERIALS.length].id;
    });
    return map;
  }
  const T1_TO_T2_MAP = buildT1RecipeMap();

  // Deterministic mapping for T2+T1 and T2+T2 (including same-type) -> 10 T3 materials
  function resolveCraftOutput(idA, idB) {
    const a = ALL_MAT_MAP[idA], b = ALL_MAT_MAP[idB];
    if (!a || !b) return null;
    const key = [idA, idB].sort().join('+');
    if (a.tier === 1 && b.tier === 1) {
      return T1_TO_T2_MAP[key] || T2_MATERIALS[0].id;
    }
    if ((a.tier === 2 && b.tier <= 2) || (b.tier === 2 && a.tier <= 2)) {
      let hash = 0;
      for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
      return T3_MATERIALS[hash % T3_MATERIALS.length].id;
    }
    return null;
  }

  // Find a sample recipe for reverse lookup in Dex / Build
  function findSampleRecipe(targetId) {
    const mat = ALL_MAT_MAP[targetId];
    if (!mat) return null;
    if (mat.tier === 2) {
      const found = Object.entries(T1_TO_T2_MAP).find(([, v]) => v === targetId);
      return found ? found[0].split('+') : null;
    }
    if (mat.tier === 3) {
      // Check same-type T2+T2 first, then mixed T2+T2
      for (let i = 0; i < T2_MATERIALS.length; i++) {
        const idA = T2_MATERIALS[i].id;
        if (resolveCraftOutput(idA, idA) === targetId) return [idA, idA];
      }
      for (let i = 0; i < T2_MATERIALS.length; i++) {
        for (let j = i + 1; j < T2_MATERIALS.length; j++) {
          if (resolveCraftOutput(T2_MATERIALS[i].id, T2_MATERIALS[j].id) === targetId) {
            return [T2_MATERIALS[i].id, T2_MATERIALS[j].id];
          }
        }
      }
    }
    return null;
  }

          const rawV = localStorage.getItem(T4_VAULT_KEY);

      if (Array.isArray(merged.placedFurniture)) {
        const legacyTrees = merged.placedFurniture.filter(pf => pf.furnId === 'f_cattree');
        merged.placedFurniture = merged.placedFurniture.filter(pf => pf.furnId !== 'f_cattree');

          }
        });
      }
      if (merged.ownedFurniture && merged.ownedFurniture.f_cattree) {
        delete merged.ownedFurniture.f_cattree;
      }
      // Remove any stale cat UIDs from catTrees
      const validUids = new Set((merged.ownedCats || []).map(c => c.uid));
      merged.catTrees.forEach(ct => {
        if (!Array.isArray(ct.treeCats)) ct.treeCats = [];
        ct.treeCats = ct.treeCats.filter(u => validUids.has(u));

      // Restore separately stored custom background
      if (merged.settings && merged.settings.customBgData === '__STORED_SEPARATELY__') {
        try { merged.settings.customBgData = localStorage.getItem(BG_STORAGE_KEY) || null; } catch { merged.settings.customBgData = null; }

      // Restore any protected Tier 4 cats & dex from the dedicated T4 Vault!
      try {
        const rawV = localStorage.getItem(T4_VAULT_KEY);

          const v = JSON.parse(rawV);

          (v.cats || []).forEach(vc => {

              vc.locked = true;
              merged.ownedCats.push(vc);
              merged.dex[vc.catId] = true;

      (merged.ownedCats || []).forEach(oc => {

  function saveT4Vault() {
    try {
      const t4Cats = (state.ownedCats || []).filter(oc => CAT_MAP[oc.catId] && CAT_MAP[oc.catId].tier === 4);
      const t4Dex = Object.keys(state.dex || {}).filter(id => CAT_MAP[id] && CAT_MAP[id].tier === 4);
      // Merge with existing vault so a transient glitch never erases previously vaulted T4 cats
      let prev = { cats: [], dex: [] };
      try {
        const rawV = localStorage.getItem(T4_VAULT_KEY);
        if (rawV) prev = JSON.parse(rawV) || prev;
      } catch {}
      const byUid = new Map();
      (prev.cats || []).forEach(c => { if (c && c.uid) byUid.set(c.uid, c); });
      t4Cats.forEach(c => byUid.set(c.uid, c));
      const mergedDex = Array.from(new Set([...(prev.dex || []), ...t4Dex]));
      localStorage.setItem(T4_VAULT_KEY, JSON.stringify({ cats: Array.from(byUid.values()), dex: mergedDex }));
    } catch {}
  }

    state.exp += amount;

  function isBuffActive(id) { return (state.activeBuffs[id] || 0) > Date.now(); }
  function getTrashRate() {
    let r = Math.max(0.35, 0.60 - (state.level - 1) * 0.015);
    if (isBuffActive('catcan')) r = Math.max(0.22, r - 0.12);
    if (isBuffActive('driedfish')) r = Math.max(0.25, r - 0.08);

  function getGachaIntervalMs() { return isBuffActive('catgrass') ? 8000 : 30000; }
  function getGardenCapacity() { return Math.min(10, 4 + Math.floor((state.level - 1) / 2) + Math.floor(state.placedFurniture.length / 3)); }
  function isCatBusy(uid) {

    if (state.missions.battle && state.missions.battle.catUids.includes(uid)) return '战斗中';

  function addAffection(oc, delta) {
    if (!oc) return;
    oc.affection = Math.max(0, Math.round((oc.affection + delta) * 10) / 10);
  }
  function getEffectiveStats(oc) {
    const base = CAT_MAP[oc.catId];
    if (!base) return { power: 0, explore: 0, charm: 0, gearMul: 0, weaponMul: 0 };
    if (base.id === 'c_slacker') return { power: 0, explore: 0, charm: 100, gearMul: 0, weaponMul: 0 };
    const g = oc.gearId ? EQUIP_ITEMS.find(x => x.id === oc.gearId) : null;
    const w = oc.weaponId ? EQUIP_ITEMS.find(x => x.id === oc.weaponId) : null;
    return {
      power: Math.min(100, base.power + (w ? w.bonus : 0)),
      explore: Math.min(100, base.explore + (g ? g.bonus : 0)),
      charm: Math.min(100, base.charm),
      gearMul: g ? g.rewardMul : 0, weaponMul: w ? w.rewardMul : 0
    };
  }
  function calcMissionPreview(mode, tierIdx, catUids) {
    const tier = MISSION_TIERS[tierIdx];
    const cats = catUids.map(u => state.ownedCats.find(c => c.uid === u)).filter(Boolean);
    if (!cats.length) return { chance: 0, score: 0, coinMin: tier.coinMin, coinMax: tier.coinMax, exp: tier.exp, equipBonus: 0 };
    let sumP = 0, sumS = 0, sumM = 0;
    cats.forEach(oc => {
      const st = getEffectiveStats(oc);
      if (mode === 'explore') { sumP += st.explore; sumS += st.power; sumM += st.gearMul; }
      else { sumP += st.power; sumS += st.explore; sumM += st.weaponMul; }
    });
    const score = Math.min(100, Math.round((sumP / cats.length) * 0.75 + (sumS / cats.length) * 0.25 + (cats.length - 1) * 4));
    let chance = score >= tier.req ? Math.min(95, Math.round(82 + (score - tier.req) * 0.6)) : Math.max(15, Math.round(82 - (tier.req - score) * 1.35));
    if (cats.every(c => c.catId === 'c_slacker')) chance = 12;
    const eqMul = sumM / cats.length;
    const totalMul = 1 + (score > tier.req ? Math.min(0.20, (score - tier.req) * 0.008) : 0) + eqMul;
    return { chance, score, coinMin: Math.round(tier.coinMin * totalMul), coinMax: Math.round(tier.coinMax * totalMul), exp: Math.round(tier.exp * totalMul), equipBonus: Math.round(eqMul * 100) };
  }

  /* ================================================================
     8. FEEDING LOGIC (BREED FAV + UNIQUE PERSONAL FAV + BATCH FEED)
     ================================================================ */
  function feedSingleCat(oc, foodId) {
    if ((state.foods[foodId] || 0) <= 0) return null;
    const base = CAT_MAP[oc.catId];
    state.foods[foodId]--;
    state.foodDex[foodId] = true;
    oc.feedCount = (oc.feedCount || 0) + 1;

    const isFav = (foodId === base.favBreedFood || foodId === oc.fav2);
    let newlyUnlocked = false;
    if (foodId === oc.fav2 && !oc.fav2Known) { oc.fav2Known = true; newlyUnlocked = true; }
    else if (oc.feedCount >= 5 && !oc.fav2Known) { oc.fav2Known = true; newlyUnlocked = true; }

    const isHighFood = FOOD_MAP[foodId] && FOOD_MAP[foodId].foodTier === 2;
    const gain = isHighFood ? (isFav ? 4 : 2) : (isFav ? 2 : 1);
    addAffection(oc, gain);
    return { isFav, gain, newlyUnlocked };
  }

  function batchFeedUniform(foodId) {
    let fed = 0;
    for (const oc of state.ownedCats) {
      if ((state.foods[foodId] || 0) <= 0) break;
      if (feedSingleCat(oc, foodId)) fed++;
    }
    if (fed > 0) { SFX.meow(); saveState(); showSysToast(`已给 ${fed} 只小猫喂了 ${FOOD_MAP[foodId].name}！`); }
    else showSysToast('该食物库存不足啦～');
  }

  function batchFeedFavorites() {
    let fed = 0, skipped = 0;
    for (const oc of state.ownedCats) {
      const base = CAT_MAP[oc.catId];
      const candidates = [base.favBreedFood];
      if (oc.fav2Known) candidates.push(oc.fav2);
      const chosen = candidates.find(fid => (state.foods[fid] || 0) > 0);
      if (chosen) { feedSingleCat(oc, chosen); fed++; }
      else skipped++;
    }
    if (fed > 0) { SFX.meow(); saveState(); }
    showSysToast(`一键爱吃喂食：喂了 ${fed} 只猫${skipped ? `，${skipped} 只因爱吃缺货已跳过` : '！'}`);
  }

  /* ================================================================
     9. AUTO-GACHA & TOP TOAST
     ================================================================ */
  function pickWeighted(arr) {
    const total = arr.reduce((s, x) => s + (x.weight || 1), 0);
    let r = Math.random() * total;
    for (const item of arr) { r -= (item.weight || 1); if (r <= 0) return item; }
    return arr[arr.length - 1];
  }

  function performSingleDraw(silent = false) {
    const trashRate = getTrashRate();
    const r = Math.random();
    let result = null;

    if (r < trashRate) {
      const tr = T1_TRASH[Math.floor(Math.random() * T1_TRASH.length)];
      state.materials[tr.id] = (state.materials[tr.id] || 0) + 1;
      state.matDex[tr.id] = true;
      result = { type: 'trash', dot: 'trash', id: tr.id, name: tr.name, icon: tr.icon, desc: tr.desc };
    } else {
      const u = (r - trashRate) / (1 - trashRate);
      const wT4 = isBuffActive('cb_bell') ? 0.045 : (isBuffActive('driedfish') ? 0.018 : 0.008);
      const wT3 = isBuffActive('cb_bell') ? 0.14  : (isBuffActive('driedfish') ? 0.085 : 0.035);
      const wBp = isBuffActive('driedfish') ? 0.05 : 0.025;
      const wFood2 = 0.055;
      const wGear = 0.075;
      const wT2 = isBuffActive('catcan') ? 0.30 : 0.15;
      const wT1 = Math.max(0.25, 1 - wT4 - wT3 - wBp - wFood2 - wGear - wT2);
      const p = u * (wT1 + wT2 + wT3 + wT4 + wGear + wBp + wFood2);

      if (p < wBp) {
        const gachaBps = FURNITURE_LIST.filter(f => f.source === 'gacha');
        const bp = gachaBps[Math.floor(Math.random() * gachaBps.length)];
        const already = !!state.unlockedBlueprints[bp.id];
        state.unlockedBlueprints[bp.id] = true;
        if (already) state.coins += 65;
        result = { type: 'bp', dot: 'bp', id: bp.id, name: bp.name + '图鉴', desc: already ? '已拥有该限定图鉴，自动折算 65 金币！' : '解锁了抽奖限定家具图鉴！' };
      } else if (p < wBp + wFood2) {
        const t2f = FOODS.filter(f => f.foodTier === 2);
        const fd = t2f[Math.floor(Math.random() * t2f.length)];
        state.foods[fd.id] = (state.foods[fd.id] || 0) + 1;
        state.foodDex[fd.id] = true;
        result = { type: 'food', dot: 'food', id: fd.id, name: fd.name, icon: fd.icon, desc: fd.desc };
      } else if (p < wBp + wFood2 + wGear) {
        const gachaEqPool = EQUIP_ITEMS.filter(x => !x.cardOnly);
        const eq = gachaEqPool[Math.floor(Math.random() * gachaEqPool.length)];
        state.equipBag[eq.id] = (state.equipBag[eq.id] || 0) + 1;
        result = { type: 'gear', dot: 'gear', id: eq.id, name: eq.name, icon: eq.icon, desc: `${eq.kind === 'gear' ? '探索装备' : '战斗武器'} · ${eq.desc}` };
      } else {
        let tier = 1;
        const baseOff = wBp + wFood2 + wGear;
        if (p < baseOff + wT4) tier = 4;
        else if (p < baseOff + wT4 + wT3) tier = 3;
        else if (p < baseOff + wT4 + wT3 + wT2) tier = 2;
        const cat = pickWeighted(CAT_CATALOG.filter(c => c.tier === tier));
        const uid = 'u' + (state.uidSeq++);
        const isNewBreed = !state.dex[cat.id];
        state.dex[cat.id] = true;
        const lockIt = tier === 4 || (state.settings.autoLockTier > 0 && tier >= state.settings.autoLockTier);
        state.ownedCats.push(makeOwnedCat(uid, cat.id, { locked: lockIt }));
        if (tier === 4) { saveT4Vault(); saveState(); }
        result = { type: 'cat', dot: `t${tier}`, tier, uid, catId: cat.id, name: cat.name, isNew: isNewBreed };
      }
    }

    state.gachaHistory.unshift({ ...result, time: Date.now() });
    if (state.gachaHistory.length > 10) state.gachaHistory.length = 10;

    if (!silent) {
      if (result.type === 'cat' && result.tier >= 3) { SFX.rare(); vibrate(40); }
      else if (result.type === 'cat') SFX.meow();
      else SFX.pop();
      if (!(result.type === 'trash' && state.settings.silentTrash)) showGachaToast(result);
      updateGachaOnlyShowcase(result);
    }
    return result;
  }

  function triggerAutoDraws(count) {
    const capped = Math.min(30, count);
    if (capped <= 2) {
      for (let i = 0; i < capped; i++) performSingleDraw(false);
    } else {
      const sum = { trash: 0, t1: 0, t2: 0, t3: 0, t4: 0, food: 0, gear: 0, bp: 0 };
      for (let i = 0; i < capped; i++) {
        const res = performSingleDraw(true);
        if (res.type === 'trash') sum.trash++;
        else if (res.type === 'cat') sum[`t${res.tier}`]++;
        else if (res.type === 'gear') sum.gear++;
        else if (res.type === 'food') sum.food++;
        else if (res.type === 'bp') sum.bp++;
      }
      openDetailModal('🧋 后台挂机补抽总结', `<div style="text-align:center;font-size:13px;line-height:1.8;">
        自动补抽了 <b>${capped}</b> 次：<br>一级垃圾 ×${sum.trash} ｜ 一级猫 ×${sum.t1} ｜ 二级猫 ×${sum.t2} ｜ 三级猫 ×${sum.t3}${sum.t4 ? ` ｜ 🔮四级绝密 ×${sum.t4}` : ''} ｜ 高级食物 ×${sum.food} ｜ 装备/武器 ×${sum.gear} ｜ 图鉴 ×${sum.bp}
      </div>`);
    }
    saveState(); refreshAllUI();
  }

  function showGachaToast(res) {
    const wrap = document.getElementById('gacha-toast-wrap');
    if (document.getElementById('gacha-only-view').classList.contains('active')) return;
    while (wrap.children.length >= 2) wrap.removeChild(wrap.lastChild);

    const el = document.createElement('div');
    el.className = 'gacha-toast';
    let thumb = '', sub = '';
    if (res.type === 'cat') {
      const cat = CAT_MAP[res.catId];
      thumb = renderCatSVG(cat, 42);
      sub = `${res.isNew ? `✨新发现！爱吃${FOOD_MAP[cat.favBreedFood].name} · ` : ''}武${cat.power} 探${cat.explore} 魅${cat.charm}`;
    } else if (res.type === 'trash' || res.type === 'gear' || res.type === 'food') {
      thumb = `<div style="font-size:26px;width:42px;text-align:center;">${res.icon}</div>`;
      sub = res.type === 'trash' ? '一级垃圾 · 点工坊两两合成' : res.desc;
    } else {
      thumb = renderFurnitureSVG(res.id, 42);
      sub = '限定图鉴 · 点击查看';
    }
    el.innerHTML = `
      <span class="${res.dot==='t4'?'rarity-dot t4-shimmer':(res.dot==='t3'?'rarity-dot shimmer':'rarity-dot')}" style="background:${DOT_COLORS[res.dot]};"></span>
      <div style="flex-shrink:0;">${thumb}</div>
      <div style="text-align:left;min-width:0;flex:1;padding-right:10px;">
        <div style="font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">抽到了 ${res.name}</div>
        <div style="font-size:11px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${sub}</div>
      </div>
    `;
    let timer = null, dismissed = false;
    const dismiss = () => {
      if (dismissed) return;
      dismissed = true;
      clearTimeout(timer);
      el.classList.add('hiding');
      setTimeout(() => el.remove(), 240);
    };
    const startT = () => { if (!dismissed) timer = setTimeout(dismiss, (state.settings.toastSec || 5) * 1000); };
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    el.addEventListener('mouseleave', startT);

    // Manual swipe-to-dismiss (left / right / up) + tap-to-open
    let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
    el.addEventListener('pointerdown', (e) => {
      clearTimeout(timer);
      startX = e.clientX; startY = e.clientY; dx = 0; dy = 0; dragging = true;
      el.style.transition = 'none';
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      dx = e.clientX - startX;
      dy = Math.min(0, e.clientY - startY);
      el.style.transform = `translate(${dx}px, ${dy}px)`;
      el.style.opacity = String(Math.max(0.2, 1 - (Math.abs(dx) + Math.abs(dy)) / 140));
    });
    el.addEventListener('pointerup', () => {
      if (!dragging) return;
      dragging = false;
      if (Math.abs(dx) > 55 || dy < -32) {
        dismissed = true;
        el.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
        el.style.transform = `translate(${dx ? Math.sign(dx) * 220 : 0}px, ${dy < -32 ? -60 : 0}px)`;
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 180);
      } else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
        dismiss();
        openDrawResultDetail(res);
      } else {
        el.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
        el.style.transform = '';
        el.style.opacity = '1';
        startT();
      }
    });
    wrap.prepend(el);
    startT();
  }

  function openDrawResultDetail(res) {
    if (res.type === 'cat') openCatDetailModal(res.uid, res.catId);
    else if (res.type === 'bp') openDetailModal(`📜 ${res.name}`, `<div style="text-align:center;">${renderFurnitureSVG(res.id, 92)}<div style="font-size:13px;margin-top:8px;">${res.desc}</div></div>`);
    else openDetailModal(res.name, `<div style="text-align:center;"><div style="font-size:52px;margin:8px 0;">${res.icon}</div><div style="font-size:13px;">${res.desc}</div></div>`);
  }

          <button class="tab-btn active" id="cd-rename-save" type="button">保存</button>
        </div>
      `;
    }

    let favHtml = `<span class="stat-tag fav">💖 品种爱吃：${breedFood.icon}${breedFood.name}</span>`;
    if (oc) {
      const f2 = FOOD_MAP[oc.fav2];
      favHtml += oc.fav2Known
        ? `<span class="stat-tag fav">🌟 专属爱吃：${f2.icon}${f2.name}</span>`

          <button class="tab-btn" id="cd-pick-weapon" type="button" style="background:var(--blue);">⚔️ 武器：${wItem ? wItem.icon+wItem.name : '点击装配'}</button>
        </div>
        <div style="background:#FDF7F0;border:1.5px solid var(--milktea-border);border-radius:14px;padding:8px;margin-bottom:8px;">
          <div style="font-size:12px;font-weight:800;margin-bottom:5px;">🍽️ 喂食提升好感度（当前：💕 ${oc.affection}）</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;">
            ${availFoods.length ? availFoods.map(f => `<button class="tab-btn" data-feed="${f.id}" type="button" style="font-size:11px;padding:4px 7px;">${f.icon}${f.name} ×${state.foods[f.id]}</button>`).join('') : '<span style="font-size:11px;color:var(--text-soft);">仓库暂无食物，去商店或菜园收获吧～</span>'}
          </div>

          <button class="pill-btn mint" id="cd-lock" type="button">${oc.locked ? '🔒 已锁定' : '🔓 未锁定'}</button>
          <button class="pill-btn pink" id="cd-sell" type="button" ${busy || oc.locked ? 'disabled' : ''}>🏪 寄送宠物店 (+${cat.sell}🪙)</button>

          saveState(); openCatDetailModal(oc.uid);
          if (activeModal === 'warehouse') renderWarehouseModal();
        }
      }));
      document.getElementById('cd-lock').addEventListener('click', () => {
        oc.locked = !oc.locked; saveState(); openCatDetailModal(oc.uid);
        if (activeModal === 'warehouse') renderWarehouseModal();
      });
      document.getElementById('cd-sell').addEventListener('click', () => {
        if (sellCatToPetShop(oc.uid)) { closeDetailModal(); refreshAllUI(); if (activeModal === 'warehouse') renderWarehouseModal(); }
      });
    }
  }

  function sellCatToPetShop(uid) {
    const idx = state.ownedCats.findIndex(c => c.uid === uid);
    if (idx === -1) return false;
    const oc = state.ownedCats[idx];
    if (oc.locked || isCatBusy(uid)) return false;
    const cat = CAT_MAP[oc.catId];
    if (oc.gearId) state.equipBag[oc.gearId] = (state.equipBag[oc.gearId] || 0) + 1;
    if (oc.weaponId) state.equipBag[oc.weaponId] = (state.equipBag[oc.weaponId] || 0) + 1;
    state.ownedCats.splice(idx, 1);
    getPlacedCatTrees().forEach(ct => { ct.treeCats = (ct.treeCats || []).filter(u => u !== uid); });
    state.coins += cat.sell;
    SFX.coin();
    if (cat.tier === 4) removeT4FromVault(uid);
    showSysToast(`已将 ${catDisplayName(oc)} 寄送宠物店，获得 🪙 ${cat.sell}`);
    saveState(); return true;
  }

  function openEquipPickerModal(uid, onDone = null) {
    const oc = state.ownedCats.find(c => c.uid === uid);
    if (!oc) return;
    const cat = CAT_MAP[oc.catId];
    if (cat.id === 'c_slacker') {
      openDetailModal('终极躺平猫拒绝配装', `<div style="text-align:center;">${renderCatSVG(cat, 96)}<div class="quote-box">“它把装备和咸鱼大剑当枕头睡着了，武力和探索值纹丝不动（依然是 0）！”</div></div>`);
      return;
    }
    const sec = (title, kind, curId) => {
      const items = EQUIP_ITEMS.filter(x => x.kind === kind);
      let h = `<div style="font-size:13px;font-weight:800;margin:8px 0 5px;">${title}（当前：${curId ? EQUIP_ITEMS.find(x=>x.id===curId).name : '未穿戴'}）</div><div style="display:flex;flex-wrap:wrap;gap:6px;">`;
      if (curId) h += `<button class="tab-btn" data-kind="${kind}" data-eq="none">卸下</button>`;
      items.forEach(it => {
        const cnt = state.equipBag[it.id] || 0;
        if (cnt > 0) h += `<button class="tab-btn" data-kind="${kind}" data-eq="${it.id}">${it.icon}${it.name}(+${it.bonus}) ×${cnt}</button>`;
      });
      return h + `</div>`;
    };
    openDetailModal(`为 ${catDisplayName(oc)} 配装`, `
      <div style="font-size:12px;color:var(--text-soft);">装备与武器为可选加分项，提升成功率、收益与经验。</div>
      ${sec('🧭 探索装备', 'gear', oc.gearId)}${sec('⚔️ 战斗武器', 'weapon', oc.weaponId)}
      <div style="margin-top:12px;text-align:center;"><button class="pill-btn mint" id="eq-done-btn" type="button">完成</button></div>
    `);
    document.getElementById('eq-done-btn').addEventListener('click', () => { if (onDone) onDone(); else closeDetailModal(); });
    document.querySelectorAll('#detail-body button[data-eq]').forEach(btn => btn.addEventListener('click', () => {
      const prop = btn.dataset.kind === 'gear' ? 'gearId' : 'weaponId';
      if (oc[prop]) state.equipBag[oc[prop]] = (state.equipBag[oc[prop]] || 0) + 1;
      if (btn.dataset.eq === 'none') oc[prop] = null;
      else if ((state.equipBag[btn.dataset.eq] || 0) > 0) { state.equipBag[btn.dataset.eq]--; oc[prop] = btn.dataset.eq; }
      SFX.pop(); saveState(); openEquipPickerModal(uid, onDone);
      if (activeModal) renderActiveModal();
    }));
  }

     11. GARDEN RENDERING, PASSERSBY (FIXED MOBILE BUBBLES) & AMBIENT FX

  function applyBackgroundAndUI() {

  function renderGarden() {

      const fm = FURNITURE_LIST.find(f => f.id === pf.furnId);
      if (fm) styleCounts[fm.style] = (styleCounts[fm.style] || 0) + 1;
    });
    const activeTheme = Object.entries(styleCounts).find(([, c]) => c >= 3);
    const tb = document.getElementById('theme-badge');
    if (activeTheme) { tb.textContent = `✨ ${activeTheme[0]}庭院`; tb.classList.add('show'); }

    state.placedFurniture.forEach(pf => {
      const fMeta = FURNITURE_LIST.find(f => f.id === pf.furnId);

      el.style.zIndex = Math.round(pf.y * 2) + (pf.zOffset || 0);

        const tCats = (pf.treeCats || []).map(u => state.ownedCats.find(c => c.uid === u)).filter(c => c && !isCatBusy(c.uid));
        treeOverlay = `<div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;pointer-events:none;">${tCats.slice(0,5).map(oc => renderCatSVG(CAT_MAP[oc.catId], 30)).join('')}</div>

      }
      el.innerHTML = `<div class="inner-flip">${renderFurnitureSVG(pf.furnId, getFurnYardSize(pf.furnId))}</div>${treeOverlay}`;
      el.addEventListener('pointerdown', (e) => {

        e.stopPropagation(); selectedPlacedId = pf.pid; el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);
        const rect = stage.getBoundingClientRect();
        const onMove = (mv) => {
          let nx = Math.max(6, Math.min(94, ((mv.clientX - rect.left) / rect.width) * 100));
          let ny = Math.max(18, Math.min(92, ((mv.clientY - rect.top) / rect.height) * 100));
          if (state.settings.gridSnap) { nx = Math.round(nx / 4) * 4; ny = Math.round(ny / 4) * 4; }
          pf.x = Math.round(nx * 10) / 10; pf.y = Math.round(ny * 10) / 10;
          el.style.left = pf.x + '%'; el.style.top = pf.y + '%';
          el.style.zIndex = Math.round(pf.y * 2) + (pf.zOffset || 0);
          positionFurnToolbar(pf);
        };
        const onUp = () => {
          el.classList.remove('dragging');
          el.removeEventListener('pointermove', onMove); el.removeEventListener('pointerup', onUp);
          saveState(); renderGarden(); positionFurnToolbar(pf);

        el.addEventListener('pointermove', onMove); el.addEventListener('pointerup', onUp);

          <rect x="16" y="79" width="68" height="10" rx="5" fill="#E6C7A8" stroke="#A67E5C" stroke-width="2"/>
          <rect x="45" y="26" width="10" height="54" rx="4" fill="#DFC09E" stroke="#A67E5C" stroke-width="1.8"/>
          <rect x="20" y="54" width="8" height="26" rx="3" fill="#DFC09E"/><rect x="72" y="58" width="8" height="22" rx="3" fill="#DFC09E"/>

      `;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!editMode) openCatTreeUpgradeModal(ct.tid);
      });
      el.addEventListener('pointerdown', (e) => {
        if (!editMode) return;
        e.stopPropagation(); el.classList.add('dragging'); el.setPointerCapture(e.pointerId);
        const rect = stage.getBoundingClientRect();
        const onMove = (mv) => {
          ct.x = Math.round(Math.max(8, Math.min(92, ((mv.clientX - rect.left) / rect.width) * 100)) * 10) / 10;
          ct.y = Math.round(Math.max(20, Math.min(90, ((mv.clientY - rect.top) / rect.height) * 100)) * 10) / 10;

        };
        const onUp = () => {
          el.classList.remove('dragging'); el.removeEventListener('pointermove', onMove); el.removeEventListener('pointerup', onUp);
          saveState(); renderGarden();
        };
        el.addEventListener('pointermove', onMove); el.addEventListener('pointerup', onUp);
      });
      stage.appendChild(el);
    });

        state.ownedCats.filter(c => c.inGarden && !isCatBusy(c.uid)).forEach(oc => {
      const cat = CAT_MAP[oc.catId];
      if (!cat) return;
      const el = document.createElement('div');
      el.className = 'yard-cat' + (cat.visual.flat ? ' resting' : '');
      el.dataset.uid = oc.uid;
      el.style.left = (oc.gx || 50) + '%'; el.style.top = (oc.gy || 60) + '%';
      el.style.zIndex = Math.round((oc.gy || 60) * 2) + 2;
      el.innerHTML = `<div class="${cat.visual.flat ? '' : 'cat-bob'}">${renderCatSVG(cat, 64)}</div>`;
      el.addEventListener('click', (e) => {
        e.stopPropagation(); SFX.meow();
        if (state.settings.catBubbles) {
          const b = document.createElement('div'); b.className = 'speech-bubble';
          b.textContent = catDisplayName(oc) + '：' + cat.quote.slice(0, 16) + '…';
          el.appendChild(b); setTimeout(() => b.remove(), 3800);
        }
        const now = Date.now();
        if (!oc.lastPetAt || now - oc.lastPetAt >= 30000) {
          oc.lastPetAt = now;
          const tip = cat.id === 'c_slacker' ? 4 : (1 + Math.floor(cat.charm / 45));
          state.coins += tip;
          const fc = document.createElement('div'); fc.className = 'float-coin'; fc.textContent = `♥ +${tip}🪙`;
          el.appendChild(fc); setTimeout(() => fc.remove(), 1500);
          updateHudNumbers(); saveState();

      });
      stage.appendChild(el);
    });
    renderCatTree();
    if (!editMode) hideFurnToolbar();
  }

  function positionFurnToolbar(pf) {
    const bar = document.getElementById('furn-toolbar');
    if (!editMode || !pf) { hideFurnToolbar(); return; }
    if (!document.body.classList.contains('ui-mobile')) {
      const rect = document.getElementById('garden-stage').getBoundingClientRect();
      bar.style.left = Math.max(10, Math.min(window.innerWidth - 240, rect.left + (pf.x / 100) * rect.width - 110)) + 'px';
      bar.style.top = Math.max(66, rect.top + (pf.y / 100) * rect.height - 80) + 'px';
    }
    bar.classList.add('show');
  }
  function hideFurnToolbar() { document.getElementById('furn-toolbar').classList.remove('show'); }

  function getPlacedCatTrees() {
    if (!Array.isArray(state.catTrees) || !state.catTrees.length) {
      state.catTrees = [{ tid: 'ct1', x: 74, y: 64, treeLevel: 1, treeCats: [] }];
    }
    return state.catTrees;
  }
  function getTreeCapacity(pf) {
    const lvl = pf.treeLevel || 1;
    return lvl === 1 ? 3 : (lvl === 2 ? 4 : 5);
  }
  function getAllTreeCatUids() {
    const set = new Set();
    getPlacedCatTrees().forEach(pf => (pf.treeCats || []).forEach(u => set.add(u)));
    return set;
  }

  function renderCatTree() {
    // Now renders the Real In-Yard Farm directly inside the garden!
    const zone = document.getElementById('yard-farm-zone');
    if (!zone) return;
    const fTier = state.farmTier || 1;
    const totalPlots = fTier * 4;
    while (state.farmPlots.length < totalPlots) {
      state.farmPlots.push({ id: state.farmPlots.length, foodId: null, startAt: 0, durMs: 0 });
    }
    const fws = getFarmWatchers();
    const now = Date.now();
    let readyCount = 0;
    const cells = state.farmPlots.slice(0, totalPlots).map((p, idx) => {
      if (!p.foodId) return `<div class="yf-cell" style="opacity:0.65;">🟫</div>`;
      const w = fws[Math.floor(idx / 4)] ? state.ownedCats.find(c => c.uid === fws[Math.floor(idx / 4)]) : null;
      const mul = w ? (1 + (CAT_MAP[w.catId].charm / 100) * 0.85) : 1;
      const ready = (now - p.startAt) * mul >= p.durMs;
      if (ready) readyCount++;
      return `<div class="yf-cell ${ready?'ready':''}">${ready ? FOOD_MAP[p.foodId].icon : '🌱'}</div>`;
    }).join('');
    const watcherIcons = fws.slice(0, fTier).map(u => u ? '🐱' : '').join('');
    zone.innerHTML = `
      <div class="yf-header">
        <span>🌱 庭院小菜园 (${totalPlots}块) ${watcherIcons}</span>
        <span style="color:${readyCount?'#2F8E65':'var(--text-soft)'};">${readyCount ? `✨${readyCount}可收` : '点击打理'}</span>
      </div>
      <div class="yf-grid">${cells}</div>
    `;
  }

  function openCatTreeUpgradeModal(tid) {
    const pf = getPlacedCatTrees().find(x => x.tid === tid);
    if (!pf) return;
    if (!pf.treeLevel) pf.treeLevel = 1;
    if (!Array.isArray(pf.treeCats)) pf.treeCats = [];
    pf.treeCats = pf.treeCats.filter(u => state.ownedCats.some(c => c.uid === u));
    const cap = getTreeCapacity(pf);
    const upCost = pf.treeLevel === 1 ? 1200 : (pf.treeLevel === 2 ? 2400 : null);
    const otherTreeCats = new Set();
    getPlacedCatTrees().forEach(t => { if (t.tid !== tid) (t.treeCats || []).forEach(u => otherTreeCats.add(u)); });

    const html = `
      <div class="expand-banner">
        <div><b>🪜 观赏猫爬架 Lv.${pf.treeLevel}</b>（容量：${pf.treeCats.length}/${cap} 只猫）</div>
        ${upCost ? `<button class="pill-btn pink" id="ct-up-btn" type="button" ${state.coins>=upCost?'':'disabled'}>⬆ 升级至 Lv.${pf.treeLevel+1} (${cap+1}只 · 🪙${upCost})</button>` : '<span>✨ 已满级 (5只)</span>'}
      </div>
      <div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">点击下方小猫放上或请下这座猫爬架（路人经过时会按魅力打赏并概率送材料）：</div>
      <div class="card-grid" id="ct-cat-grid"></div>
    `;
    openDetailModal('🪜 管理观赏猫爬架', html);
    document.getElementById('ct-up-btn')?.addEventListener('click', () => {
      if (state.coins < upCost) return;
      state.coins -= upCost; pf.treeLevel++; SFX.rare(); saveState(); updateHudNumbers(); renderGarden(); openCatTreeUpgradeModal(tid);
      showSysToast(`🎉 猫爬架升至 Lv.${pf.treeLevel}，可放 ${getTreeCapacity(pf)} 只猫！`);
    });
    const g = document.getElementById('ct-cat-grid');
    [...state.ownedCats].sort((a, b) => CAT_MAP[b.catId].charm - CAT_MAP[a.catId].charm).forEach(oc => {

  /* --- RACCOON THIEF EVENT (>=3 MIN INTERVAL, 5s STAY, STEALS 15-30% COINS/MATS/FURN, NEVER CATS!) --- */
  let activeRaccoon = null;
  function maybeSpawnRaccoon() {
    const now = Date.now();
    if (activeRaccoon || activeModal || document.getElementById('detail-backdrop').classList.contains('open') || document.getElementById('gacha-only-view').classList.contains('active')) return;
    if (now - (state.lastRaccoonAt || 0) < 180000) return; // Strictly >= 3 minutes!

    state.lastRaccoonAt = now;
    const gv = document.getElementById('garden-view');
    const gwW = getGardenWidth();
    const visLeft = gv.scrollLeft + 70;
    const visRight = Math.min(gwW - 70, gv.scrollLeft + window.innerWidth - 70);
    const rxPx = visLeft + Math.random() * Math.max(40, visRight - visLeft);
    const rxPct = Math.max(8, Math.min(92, (rxPx / gwW) * 100));
    const ryPct = 36 + Math.random() * 40;

    const el = document.createElement('div');
    el.id = 'raccoon-thief';
    el.style.left = rxPct + '%';
    el.style.top = ryPct + '%';
    el.innerHTML = `
      <div class="rac-timer" id="rac-cd">🦝 浣熊大盗！5.0s 点我抓贼</div>

        <polygon points="73,36 78,19 60,29" fill="#8C8784" stroke="#4A4543" stroke-width="2.2"/>
        <rect x="29" y="40" width="42" height="14" rx="7" fill="#3B3736"/>
        <circle cx="40" cy="47" r="3.4" fill="#FFF"/><circle cx="60" cy="47" r="3.4" fill="#FFF"/>
        <circle cx="40" cy="47" r="1.8" fill="#222"/><circle cx="60" cy="47" r="1.8" fill="#222"/>
        <circle cx="50" cy="55" r="3" fill="#222"/>
        <circle cx="22" cy="70" r="11" fill="#D9B48A" stroke="#8C6849" stroke-width="2"/>
        <text x="16" y="74" font-size="11">💰</text>
      </svg>
    `;
    document.getElementById('garden-stage').appendChild(el);
    document.body.classList.add('rac-alert');
    SFX.tone(740, 0.12, 'sawtooth', 0.06, 520);
    vibrate(40);

    const endAt = now + 5200;
    const iv = setInterval(() => {
      if (!activeRaccoon) { clearInterval(iv); return; }
      const rem = Math.max(0, (endAt - Date.now()) / 1000);
      const cd = document.getElementById('rac-cd');
      if (cd) cd.textContent = `🦝 浣熊大盗！${rem.toFixed(1)}s 点我抓贼`;
      if (rem <= 0) {
        clearInterval(iv);
        dismissRaccoon(true);
      }
    }, 100);

    activeRaccoon = { el, iv };
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      clearInterval(iv);
      dismissRaccoon(false);
      openRaccoonBattleModal();
    });
  }

  function dismissRaccoon(escaped) {
    if (activeRaccoon) {
      clearInterval(activeRaccoon.iv);
      activeRaccoon.el.remove();
      activeRaccoon = null;
    }
    document.body.classList.remove('rac-alert');
    if (escaped) executeRaccoonTheft();
  }

  function executeRaccoonTheft() {
    const roll = Math.random();
    let msg = '';
    const stealableFurn = state.placedFurniture.filter(pf => pf.furnId !== 'f_cattree');
    const ownedMats = Object.entries(state.materials).filter(([, c]) => c > 0);
    if (roll < 0.45 && state.coins >= 20) {
      const pct = 0.15 + Math.random() * 0.15; // 15% ~ 30%
      const lost = Math.max(10, Math.round(state.coins * pct));
      state.coins = Math.max(0, state.coins - lost);
      msg = `🦝 哎呀！浣熊大盗溜走了，顺走了 🪙 ${lost} 金币（约 ${Math.round(pct*100)}%）！`;
    } else if (roll < 0.78 && ownedMats.length) {
      const [mid, cnt] = ownedMats[Math.floor(Math.random() * ownedMats.length)];
      const take = Math.max(1, Math.min(cnt, Math.ceil(cnt * 0.25)));
      state.materials[mid] -= take;
      msg = `🦝 哎呀！浣熊大盗偷走了 ${ALL_MAT_MAP[mid].icon}${ALL_MAT_MAP[mid].name} ×${take}！`;
    } else if (stealableFurn.length > 1) {
      const pf = stealableFurn[Math.floor(Math.random() * stealableFurn.length)];
      state.placedFurniture = state.placedFurniture.filter(x => x.pid !== pf.pid);
      const fm = FURNITURE_LIST.find(f => f.id === pf.furnId);
      msg = `🦝 哎呀！浣熊大盗搬走了庭院里的【${fm ? fm.name : '家具'}】！`;
    } else {
      const lost = Math.min(state.coins, Math.max(5, Math.round(state.coins * 0.18)));
      state.coins -= lost;
      msg = `🦝 浣熊大盗顺走了 🪙 ${lost} 金币逃跑了！`;
    }
    SFX.pop(); saveState(); refreshAllUI(); showSysToast(msg);
  }

  function openRaccoonBattleModal() {

      const avgPwr = picked.length ? Math.round(picked.reduce((sum, u) => sum + getEffectiveStats(state.ownedCats.find(c => c.uid === u)).power, 0) / picked.length) : 0;
      const winRate = picked.length ? Math.max(20, Math.min(96, Math.round(30 + avgPwr * 0.68))) : 0;
      const avail = [...state.ownedCats].sort((a, b) => getEffectiveStats(b).power - getEffectiveStats(a).power);
      openDetailModal('🦝 抓住了浣熊大盗！选 2 只猫迎战', `

          const rewardPool = ['furn', 'bp', 't3mat', 'food2', 'gear'];
          const rType = rewardPool[Math.floor(Math.random() * rewardPool.length)];

          } else if (rType === 'bp') {
            const locked = FURNITURE_LIST.filter(f => f.source !== 'shopDirect' && f.source !== 'cardOnly' && !state.unlockedBlueprints[f.id]);
            if (locked.length) {
              const bp = locked[Math.floor(Math.random() * locked.length)];
              state.unlockedBlueprints[bp.id] = true;
              rewardTxt = `📜 家具图鉴：<b>${bp.name}图鉴</b>`;
            } else {
              const m3 = T3_MATERIALS[Math.floor(Math.random() * T3_MATERIALS.length)];

              rewardTxt = `✨ 三级材料：<b>${m3.icon}${m3.name}</b> ×1`;
            }
          } else if (rType === 't3mat') {
            const m3 = T3_MATERIALS[Math.floor(Math.random() * T3_MATERIALS.length)];
            state.materials[m3.id] = (state.materials[m3.id] || 0) + 1; state.matDex[m3.id] = true;
            rewardTxt = `✨ 三级材料：<b>${m3.icon}${m3.name}</b> ×1`;
          } else if (rType === 'food2') {
            const f2s = FOODS.filter(f => f.foodTier === 2);
            const f2 = f2s[Math.floor(Math.random() * f2s.length)];
            state.foods[f2.id] = (state.foods[f2.id] || 0) + 1; state.foodDex[f2.id] = true;
            rewardTxt = `🍽️ 二级高级食物：<b>${f2.icon}${f2.name}</b> ×1`;
          } else {
            const gears = EQUIP_ITEMS.filter(x => x.kind === 'gear' && !x.cardOnly);

          }
          saveState(); refreshAllUI();
          openDetailModal('🎉 赶跑了浣熊大盗！', `<div style="text-align:center;line-height:1.8;">成功保住了庭院全部财物，还缴获了浣熊背包里的：<br><div style="font-size:15px;margin:10px 0;">${rewardTxt}</div></div>`);
        } else {
          closeDetailModal();
          executeRaccoonTheft();

      const g = document.getElementById('rac-cat-grid');
      avail.forEach(oc => {
        const cat = CAT_MAP[oc.catId], st = getEffectiveStats(oc), sel = picked.includes(oc.uid);
        const card = document.createElement('div'); card.className = 'item-card' + (sel ? ' selected' : '');

        card.innerHTML = `${renderCatSVG(cat, 48)}<div style="font-size:11px;font-weight:800;">${catDisplayName(oc)}</div><span class="stat-tag pwr">⚔️武力 ${st.power}</span>`;
        card.addEventListener('click', () => {
          if (sel) picked = picked.filter(u => u !== oc.uid);
          else if (picked.length < 2) picked.push(oc.uid);

        g.appendChild(card);
      });

    renderPick();
  }

  function spawnPasserby() {
    const treeUids = getAllTreeCatUids();
    const treeCats = state.ownedCats.filter(c => treeUids.has(c.uid) && !isCatBusy(c.uid));
    const gardenCats = state.ownedCats.filter(c => c.inGarden && !isCatBusy(c.uid));
    if (!treeCats.length && !gardenCats.length) return;

    const layer = document.getElementById('passerby-layer');
    const el = document.createElement('div');
    el.className = 'passerby';
    const shirts = ['#FFD6E0', '#D4ECFA', '#CCF0E1', '#F7DFC2'];
    const s = shirts[Math.floor(Math.random() * shirts.length)];
    el.innerHTML = `<svg viewBox="0 0 60 72" width="46" height="56"><ellipse cx="30" cy="66" rx="14" ry="4" fill="rgba(100,80,65,0.16)"/><rect x="20" y="34" width="20" height="24" rx="8" fill="${s}" stroke="#6B5347" stroke-width="2"/><circle cx="30" cy="20" r="13" fill="#FFEAD9" stroke="#6B5347" stroke-width="2"/><path d="M17 18 Q20 6 30 7 Q40 6 43 18 Q36 13 30 14 Q24 13 17 18 Z" fill="#6B5347"/><circle cx="25" cy="21" r="1.8" fill="#5A463C"/><circle cx="35" cy="21" r="1.8" fill="#5A463C"/><path d="M27 25 Q30 28 33 25" fill="none" stroke="#D47D8F" stroke-width="1.6" stroke-linecap="round"/></svg>`;
    layer.appendChild(el);

    // Mobile-safe stop position (center-left of cat tree, never clipping off-screen!)
    const stopX = Math.max(120, Math.min(getGardenWidth() - 250, document.getElementById('garden-view').scrollLeft + window.innerWidth * 0.42));
    requestAnimationFrame(() => { el.style.left = stopX + 'px'; });

    setTimeout(() => {
      const treeCharm = treeCats.length ? treeCats.reduce((sum, c) => sum + CAT_MAP[c.catId].charm, 0) / treeCats.length : 10;
      const gardenCharm = gardenCats.length ? gardenCats.reduce((sum, c) => sum + CAT_MAP[c.catId].charm, 0) / gardenCats.length : 0;
      const gardenMul = gardenCats.length ? (1 + Math.min(0.35, 0.05 + gardenCharm * 0.003)) : 1;
      const treeCountMul = 1 + Math.max(0, getPlacedCatTrees().length - 1) * 0.18;
      const coins = Math.min(58, Math.round((5 + (treeCharm / 100) * 24) * gardenMul * treeCountMul));
      state.coins += coins;

      // Affection +0.5 for passerby feeding/admiring!
      treeCats.forEach(c => addAffection(c, 0.5));

      let giftText = '';
      if (Math.random() < Math.min(0.35, 0.06 + (treeCharm / 100) * 0.28)) {
        const m = T2_MATERIALS[Math.floor(Math.random() * T2_MATERIALS.length)];
        state.materials[m.id] = (state.materials[m.id] || 0) + 1;
        state.matDex[m.id] = true;
        giftText = ` +${m.icon}${m.name}`;
        // Extra +0.5 affection when gift received!
        treeCats.forEach(c => addAffection(c, 0.5));
      }

      if (state.settings.passerBubbles) {
        const praises = ['好软萌的小猫！', '借我吸一口～', '猫爬架太可爱了！', '投喂小鱼干基金！'];
        const b = document.createElement('div');
        b.className = 'speech-bubble';
        b.textContent = `${praises[Math.floor(Math.random() * praises.length)]} +${coins}🪙${giftText}`;
        el.appendChild(b);
      }
      if (!document.getElementById('gacha-only-view').classList.contains('active')) SFX.coin();
      updateHudNumbers(); saveState();

      setTimeout(() => { el.style.left = (getGardenWidth() + 80) + 'px'; setTimeout(() => el.remove(), 4300); }, 3200);
    }, 4200);
  }

    else if (activeModal === 'shop') renderShopModal();

  function openPickCatForEquip(eqId) {
    const eq = EQUIP_ITEMS.find(x => x.id === eqId);
    const prop = eq.kind === 'gear' ? 'gearId' : 'weaponId';
    const html = `<div style="display:flex;flex-direction:column;gap:6px;">
      ${state.ownedCats.filter(c => c.catId !== 'c_slacker').map(oc => {
        const cur = oc[prop] ? EQUIP_ITEMS.find(x => x.id === oc[prop]).name : '无';
        return `<button class="tab-btn" data-u="${oc.uid}" style="text-align:left;display:flex;justify-content:space-between;"><span>${catDisplayName(oc)}</span><span style="color:var(--text-soft);">当前:${cur}</span></button>`;
      }).join('')}
    </div>`;
    openDetailModal(`把 ${eq.name} 穿给谁？`, html);
    document.querySelectorAll('#detail-body button[data-u]').forEach(b => b.addEventListener('click', () => {
      const oc = state.ownedCats.find(c => c.uid === b.dataset.u);
      if (!oc || (state.equipBag[eqId] || 0) <= 0) return;
      if (oc[prop]) state.equipBag[oc[prop]] = (state.equipBag[oc[prop]] || 0) + 1;
      state.equipBag[eqId]--; oc[prop] = eqId;
      SFX.pop(); saveState(); closeDetailModal(); showSysToast(`已给 ${catDisplayName(oc)} 穿戴 ${eq.name}！`);
      if (activeModal === 'warehouse') renderWarehouseModal();
    }));
  }

  /* --- CAT-SAFE GARDEN FARM MODAL --- */
  function renderFarmModal() {
    const body = document.getElementById('modal-body');
    const plantSeeds = FOODS.filter(f => f.kind === 'plant' && (state.seeds[f.id] || 0) > 0);
    const fTier = state.farmTier || 1;
    const totalPlots = fTier * 4;
    while (state.farmPlots.length < totalPlots) {
      state.farmPlots.push({ id: state.farmPlots.length, foodId: null, startAt: 0, durMs: 0 });
    }
    const watchers = getFarmWatchers();
    const nextF = FARM_EXPANSIONS.find(x => x.tier === fTier + 1);
    const expandHtml = nextF
      ? `<div class="expand-banner">
          <div><b>🌱 当前菜园：${totalPlots} 块地</b> → 扩建至 <b>${nextF.plots} 块地</b>（每 4 块地配 1 只看管猫）<br><span style="color:var(--text-soft);">条件：Lv.${nextF.reqLvl}（当前 Lv.${state.level}）｜ 费用：🪙${nextF.cost}</span></div>
          <button class="pill-btn mint" id="btn-expand-farm" type="button" ${state.level>=nextF.reqLvl && state.coins>=nextF.cost ? '' : 'disabled'}>✨ 扩建菜园</button>
        </div>`
      : `<div class="expand-banner"><span>🌱 菜园已扩建至最大规模（<b>12 块地 · 3 个看管分区</b>）！</span></div>`;

    let groupsHtml = '';
    for (let gIdx = 0; gIdx < fTier; gIdx++) {
      const wUid = watchers[gIdx];
      const wCat = wUid ? state.ownedCats.find(c => c.uid === wUid) : null;
      const spd = wCat ? Math.round((CAT_MAP[wCat.catId].charm / 100) * 85) : 0;
      groupsHtml += `
        <div class="preview-panel" style="margin:8px 0 6px;">
          <div style="font-size:12px;"><b>🌿 第 ${gIdx+1} 菜园分区（#${gIdx*4+1}~#${gIdx*4+4}）</b> · 看管猫：${wCat ? `${catDisplayName(wCat)}（提速 +${spd}%）` : '未派遣'}</div>
          <button class="tab-btn" data-fw="${gIdx}" type="button" style="background:var(--pink);">${wCat ? '更换看管猫' : '🐾 派猫看管本区4块地'}</button>
        </div>
        <div class="card-grid" id="farm-grid-${gIdx}"></div>
      `;
    }

    body.innerHTML = `${expandHtml}${groupsHtml}`;
    document.getElementById('btn-expand-farm')?.addEventListener('click', () => {
      if (!nextF || state.level < nextF.reqLvl || state.coins < nextF.cost) return;
      state.coins -= nextF.cost; state.farmTier = nextF.tier;
      SFX.rare(); saveState(); updateHudNumbers(); renderFarmModal();
      showSysToast(`🎉 菜园已扩建至 ${nextF.plots} 块地！`);
    });
    body.querySelectorAll('[data-fw]').forEach(b => b.addEventListener('click', () => openPickFarmWatcher(Number(b.dataset.fw))));

    for (let gIdx = 0; gIdx < fTier; gIdx++) {
      const g = document.getElementById(`farm-grid-${gIdx}`);
      const wUid = watchers[gIdx];
      const wCat = wUid ? state.ownedCats.find(c => c.uid === wUid) : null;
      const speedMul = wCat ? (1 + (CAT_MAP[wCat.catId].charm / 100) * 0.85) : 1;
      const speedPct = Math.round((speedMul - 1) * 100);

      for (let p = gIdx * 4; p < gIdx * 4 + 4; p++) {
        const plot = state.farmPlots[p];
        const card = document.createElement('div'); card.className = 'item-card';
        if (!plot.foodId) {
          card.innerHTML = `<div style="font-size:30px;">🪴</div><div style="font-size:12px;font-weight:800;">空菜地 #${plot.id+1}</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:3px;max-height:105px;overflow-y:auto;">
              ${plantSeeds.length ? plantSeeds.map(sd => `<button class="tab-btn" data-plant="${sd.id}" style="font-size:10px;padding:3px 6px;">${sd.icon}${sd.name}×${state.seeds[sd.id]}</button>`).join('') : '<span style="font-size:10px;color:var(--text-soft);">暂无种子</span>'}
            </div>`;
          card.querySelectorAll('[data-plant]').forEach(b => b.addEventListener('click', () => {
            const fid = b.dataset.plant; if ((state.seeds[fid] || 0) <= 0) return;
            state.seeds[fid]--; plot.foodId = fid; plot.startAt = Date.now(); plot.durMs = FOOD_MAP[fid].growSec * 1000;
            SFX.pop(); saveState(); renderFarmModal();
          }));
        } else {
          const f = FOOD_MAP[plot.foodId];
          const elapsed = (Date.now() - plot.startAt) * speedMul;
          const remSec = Math.max(0, Math.ceil((plot.durMs - elapsed) / (1000 * speedMul)));
          const ready = remSec <= 0;
          card.innerHTML = `<div style="font-size:32px;">${ready ? f.icon : '🌱'}</div>
            <div style="font-size:12px;font-weight:800;">${f.name}</div>
            <div style="font-size:11px;color:${ready?'#2F8E65':'var(--text-soft)'};">${ready ? '🎉 已成熟！' : `剩余 ${formatTime(remSec)}`}</div>
            ${ready ? `<button class="tab-btn" data-harvest="1" style="background:var(--mint);margin-top:3px;">🧺 收获</button>` : `<div style="font-size:10px;color:var(--text-soft);">${wCat ? `✨加速 +${speedPct}%` : '自然生长中'}</div>`}`;
          if (ready) card.querySelector('[data-harvest]').addEventListener('click', () => {
            const qty = Math.random() < 0.25 ? 2 : 1;
            state.foods[plot.foodId] = (state.foods[plot.foodId] || 0) + qty; state.foodDex[plot.foodId] = true;
            plot.foodId = null; SFX.craft(); saveState(); showSysToast(`收获了 ${f.icon}${f.name} ×${qty}！`); renderFarmModal();
          });
        }
        g.appendChild(card);
      }
    }
  }

  function openPickFarmWatcher(groupIdx) {
    const watchers = getFarmWatchers();
    const curUid = watchers[groupIdx];
    const idleCats = state.ownedCats.filter(c => !isCatBusy(c.uid) || c.uid === curUid).sort((a, b) => CAT_MAP[b.catId].charm - CAT_MAP[a.catId].charm);
    openDetailModal(`指派第 ${groupIdx+1} 分区（4块地）看管猫`, `<div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">魅力值越高，本区 4 块菜地生长越快！</div><div style="display:flex;flex-direction:column;gap:5px;">
      ${curUid ? `<button class="tab-btn" data-w="none">取消看管</button>` : ''}
      ${idleCats.map(oc => `<button class="tab-btn" data-w="${oc.uid}" style="display:flex;justify-content:space-between;"><span>${catDisplayName(oc)}</span><span>💖魅力 ${CAT_MAP[oc.catId].charm}</span></button>`).join('')}
    </div>`);
    document.querySelectorAll('#detail-body button[data-w]').forEach(b => b.addEventListener('click', () => {
      const oldW = curUid ? state.ownedCats.find(c => c.uid === curUid) : null;
      const oldMul = oldW ? (1 + (CAT_MAP[oldW.catId].charm / 100) * 0.85) : 1;
      const now = Date.now();
      watchers[groupIdx] = b.dataset.w === 'none' ? null : b.dataset.w;
      const newW = watchers[groupIdx] ? state.ownedCats.find(c => c.uid === watchers[groupIdx]) : null;
      const newMul = newW ? (1 + (CAT_MAP[newW.catId].charm / 100) * 0.85) : 1;
      for (let p = groupIdx * 4; p < groupIdx * 4 + 4; p++) {
        const plot = state.farmPlots[p];
        if (plot && plot.foodId) {
          const doneMs = (now - plot.startAt) * oldMul;
          plot.startAt = now - (doneMs / newMul);
        }
      }
      SFX.pop(); saveState(); closeDetailModal(); renderGarden(); renderFarmModal();
    }));
  }

  /* --- 3-TIER WORKSHOP MODAL (T1+T1->T2, T2+T1/T2->T3, SAME-TYPE ALLOWED!) --- */
  function renderWorkshopModal() {
    const tab = modalSubTab || 't1';
    const body = document.getElementById('modal-body');
    const sA = craftSlots[0] ? ALL_MAT_MAP[craftSlots[0]] : null;
    const sB = craftSlots[1] ? ALL_MAT_MAP[craftSlots[1]] : null;
    const previewOut = (sA && sB) ? resolveCraftOutput(sA.id, sB.id) : null;

    let discHtml = '';
    const keys = Object.keys(state.discoveredRecipes);
    if (keys.length) {
      discHtml = `<div style="font-size:12px;font-weight:800;margin:10px 0 5px;">📒 已发现配方（点配方直接合成）</div><div style="display:flex;flex-wrap:wrap;gap:5px;">`;
      keys.slice(0, 24).forEach(k => {
        const [a, b] = k.split('+');
        const ma = ALL_MAT_MAP[a], mb = ALL_MAT_MAP[b], out = ALL_MAT_MAP[state.discoveredRecipes[k]];
        const can = a === b ? (state.materials[a] || 0) >= 2 : ((state.materials[a] || 0) > 0 && (state.materials[b] || 0) > 0);
        discHtml += `<button class="tab-btn" data-q="${k}" style="font-size:11px;padding:4px 7px;" ${can?'':'disabled'}>${ma.icon}+${mb.icon}→${out.icon}${out.name}</button>`;
      });
      discHtml += `</div>`;
    }

    body.innerHTML = `
      <div style="font-size:11px;color:var(--text-soft);margin-bottom:8px;">
        支持<b>同种</b>或<b>不同种</b>组合：一级+一级 → <b>二级材料(36种)</b>；二级+一级 或 二级+二级 → <b>三级高级材料(10种)</b>。
      </div>
      <div class="combiner-box">
        <div class="slot-pair">
          <div class="craft-slot ${sA?'filled':''}" id="slot-a">${sA ? `<div style="font-size:24px;">${sA.icon}</div><div>${sA.name}</div>` : '选材料 1'}</div>
          <div style="font-size:18px;font-weight:800;">+</div>
          <div class="craft-slot ${sB?'filled':''}" id="slot-b">${sB ? `<div style="font-size:24px;">${sB.icon}</div><div>${sB.name}</div>` : '选材料 2'}</div>
        </div>
        <div style="font-size:12px;color:#2F7A5E;font-weight:700;">${previewOut ? `预计合成：${ALL_MAT_MAP[previewOut].icon} ${ALL_MAT_MAP[previewOut].name}` : (sA && sB ? '一级和三级无法组合哦' : '请从下方选择两个材料')}</div>
        <div style="display:flex;gap:8px;">
          <button class="pill-btn mint" id="btn-do-craft" type="button" ${previewOut?'':'disabled'}>♻️ 合成 ×1</button>
          <button class="pill-btn" id="btn-clear-craft" type="button">清空</button>
        </div>
      </div>
      <div class="tabs-row">
        <button class="tab-btn ${tab==='t1'?'active':''}" data-tab="t1">一级垃圾(10)</button>
        ${T2_CATS.map(c => `<button class="tab-btn ${tab===c?'active':''}" data-tab="${c}">${c}</button>`).join('')}
      </div>
      <div class="card-grid" id="ws-grid"></div>
      ${discHtml}
    `;

    body.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.addEventListener('click', () => { modalSubTab = b.dataset.tab; renderWorkshopModal(); }));
    document.getElementById('slot-a').addEventListener('click', () => { craftSlots[0] = null; renderWorkshopModal(); });
    document.getElementById('slot-b').addEventListener('click', () => { craftSlots[1] = null; renderWorkshopModal(); });
    document.getElementById('btn-clear-craft').addEventListener('click', () => { craftSlots = [null, null]; renderWorkshopModal(); });

    const doCraft = (idA, idB) => {
      const outId = resolveCraftOutput(idA, idB);
      if (!outId) return showSysToast('这两个材料无法组合哦');
      if (idA === idB) { if ((state.materials[idA] || 0) < 2) return showSysToast('同种合成需要至少 2 个库存！'); }
      else if ((state.materials[idA] || 0) < 1 || (state.materials[idB] || 0) < 1) return showSysToast('材料数量不足！');
      state.materials[idA]--; state.materials[idB]--;
      state.materials[outId] = (state.materials[outId] || 0) + 1;
      state.matDex[outId] = true;
      const k = [idA, idB].sort().join('+');
      const isNew = !state.discoveredRecipes[k];
      state.discoveredRecipes[k] = outId;
      SFX.craft();
      showSysToast(`${isNew?'✨新配方！':''}合成了 ${ALL_MAT_MAP[outId].icon}${ALL_MAT_MAP[outId].name} ×1`);
      if ((state.materials[idA] || 0) <= 0) craftSlots[0] = null;
      if ((state.materials[idB] || 0) <= 0) craftSlots[1] = null;
      saveState(); renderWorkshopModal();
    };
    document.getElementById('btn-do-craft').addEventListener('click', () => doCraft(craftSlots[0], craftSlots[1]));
    body.querySelectorAll('button[data-q]').forEach(b => b.addEventListener('click', () => { const [x, y] = b.dataset.q.split('+'); doCraft(x, y); }));

    const g = document.getElementById('ws-grid');
    const list = tab === 't1' ? T1_TRASH : T2_MATERIALS.filter(m => m.cat === tab);
    list.forEach(m => {
      const cnt = state.materials[m.id] || 0;
      const card = document.createElement('div'); card.className = 'item-card';
      card.style.opacity = cnt > 0 ? '1' : '0.48'; card.style.cursor = cnt > 0 ? 'pointer' : 'default';
      card.innerHTML = `<div style="font-size:24px;">${m.icon}</div><div style="font-size:12px;font-weight:700;">${m.name}</div><div style="font-size:11px;">库存：${cnt}</div>`;
      if (cnt > 0) card.addEventListener('click', () => {
        if (!craftSlots[0]) craftSlots[0] = m.id;
        else if (!craftSlots[1]) {
          if (craftSlots[0] === m.id && cnt < 2) return showSysToast('同种合成需要至少 2 个哦～');
          craftSlots[1] = m.id;
        } else craftSlots[1] = m.id;
        SFX.pop(); renderWorkshopModal();
      });
      g.appendChild(card);
    });
  }
