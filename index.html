  /* --- EXPLORE & BATTLE MISSIONS (4 TIERS + DIRECT EQUIP + AFFECTION + SEEDS + T3 MATS) --- */
  function renderMissionModal(mode) {
    const body = document.getElementById('modal-body');
    const active = state.missions[mode], isExp = mode === 'explore';
    if (active) {
      const remSec = Math.max(0, Math.ceil((active.endAt - Date.now()) / 1000)), done = remSec <= 0;
      const cats = active.catUids.map(u => state.ownedCats.find(c => c.uid === u)).filter(Boolean);
      const t = MISSION_TIERS[active.tierIdx];
      body.innerHTML = `<div class="running-mission-card">
        <div style="font-size:15px;font-weight:800;">${isExp?'🧭':'⚔️'} ${t.label}（${t.mins}分钟）· ${active.targetName}</div>
        <div style="display:flex;justify-content:center;gap:8px;margin:10px 0;">${cats.map(oc => renderCatSVG(CAT_MAP[oc.catId], 62)).join('')}</div>
        <div style="font-size:13px;font-weight:700;" id="mission-cd-text">${done ? '🎉 小队已归来！' : `倒计时：${formatTime(remSec)}`}</div>
        <div style="margin-top:10px;"><button class="pill-btn ${done?'mint':''}" id="btn-claim-mission" type="button" ${done?'':'disabled'}>${done?'🎁 领取总结与奖励':'小队努力中…'}</button></div>
      </div>`;
      if (done) document.getElementById('btn-claim-mission').addEventListener('click', () => claimMission(mode));
      return;
    }

    const draft = missionDraft[mode];
    draft.catUids = draft.catUids.filter(u => state.ownedCats.some(c => c.uid === u) && !isCatBusy(u));
    const prev = calcMissionPreview(mode, draft.tierIdx, draft.catUids), tier = MISSION_TIERS[draft.tierIdx];
    body.innerHTML = `
      <div style="font-size:11px;color:var(--text-soft);margin-bottom:7px;">
        ${isExp ? '探索主看【探索值】，可掉稀有植物种子、二三级材料与探索图鉴；胜 +'+tier.affWin+' 好感，败 -'+tier.affLose+' 好感。' : '战斗主看【武力值】，可掉稀有植物种子、二三级材料与战斗图鉴；胜 +'+tier.affWin+' 好感，败 -'+tier.affLose+' 好感。'}（不掉装备武器）
      </div>
      <div class="tier-grid">
        ${MISSION_TIERS.map(t => `<button class="tier-btn ${draft.tierIdx===t.idx?'active':''}" data-tier="${t.idx}" type="button">
          <div>${t.label}</div><div style="font-size:13px;font-weight:800;">⏱️ ${t.mins}分钟</div>
          <div style="font-size:10px;color:var(--text-soft);">推荐双值${t.req}+ · 胜败±${t.affWin}好感</div>
        </button>`).join('')}
      </div>
      <div class="preview-panel">
        <div>
          <div>综合实力：<b>${prev.score}/100</b> ｜ 成功率：<b style="color:${prev.chance>=70?'#2F8E65':'#C7644B'};">${prev.chance}%</b></div>
          <div style="font-size:11px;color:var(--text-soft);">金币 🪙${prev.coinMin}~${prev.coinMax} ｜ 经验 +${prev.exp}${prev.equipBonus?` (装备+${prev.equipBonus}%)`:''}</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="pill-btn blue" id="btn-auto-equip" type="button" style="font-size:11px;">✨ 一键配装</button>
          <button class="pill-btn pink" id="btn-start-mission" type="button" ${draft.catUids.length?'':'disabled'}>🚀 出发 (${draft.catUids.length}/3)</button>
        </div>
      </div>
      <div class="card-grid" id="mission-cat-grid"></div>

    document.getElementById('btn-auto-equip').addEventListener('click', () => {
      if (!draft.catUids.length) return showSysToast('先选 1～3 只猫哦');
      const kind = isExp ? 'gear' : 'weapon', prop = isExp ? 'gearId' : 'weaponId';
      const avail = EQUIP_ITEMS.filter(x => x.kind === kind).sort((a, b) => b.bonus - a.bonus);
      let ok = false;
      draft.catUids.forEach(u => {
        const oc = state.ownedCats.find(c => c.uid === u);
        if (!oc || oc.catId === 'c_slacker' || oc[prop]) return;
        const best = avail.find(it => (state.equipBag[it.id] || 0) > 0);
        if (best) { state.equipBag[best.id]--; oc[prop] = best.id; ok = true; }
      });
      if (ok) { SFX.pop(); saveState(); showSysToast('已自动穿戴最强可用装备/武器！'); renderMissionModal(mode); }

      const cat = CAT_MAP[oc.catId], st = getEffectiveStats(oc), busy = isCatBusy(oc.uid), sel = draft.catUids.includes(oc.uid);
      const eq = isExp ? (oc.gearId ? EQUIP_ITEMS.find(x => x.id === oc.gearId) : null) : (oc.weaponId ? EQUIP_ITEMS.find(x => x.id === oc.weaponId) : null);

      card.style.opacity = busy ? '0.5' : '1';
      card.innerHTML = `<span class="${cat.tier===4?'rarity-dot t4-shimmer':(cat.tier===3?'rarity-dot shimmer':'rarity-dot')}" style="background:${DOT_COLORS['t'+cat.tier]};"></span>

        <div class="stat-row"><span class="stat-tag pwr">武${st.power}</span><span class="stat-tag exp">探${st.explore}</span></div>
        <div style="display:flex;gap:4px;margin-top:2px;">
          <button class="tab-btn" data-eq="1" style="font-size:10px;padding:2px 6px;" ${busy?'disabled':''}>${eq ? eq.icon+'换装' : '+配装'}</button>
          <span style="font-size:10px;color:var(--text-soft);align-self:center;">${busy || (sel?'✅已选':'点卡选')}</span>
        </div>`;
      card.querySelector('[data-eq]').addEventListener('click', (e) => { e.stopPropagation(); openEquipPickerModal(oc.uid, () => { closeDetailModal(); renderMissionModal(mode); }); });
      if (!busy) card.addEventListener('click', () => {
        if (sel) draft.catUids = draft.catUids.filter(u => u !== oc.uid);
        else { if (draft.catUids.length >= 3) return showSysToast('最多派 3 只猫'); draft.catUids.push(oc.uid); }
        SFX.pop(); renderMissionModal(mode);
      });
      g.appendChild(card);
    });
  }

  function claimMission(mode) {
    const m = state.missions[mode]; if (!m) return;
    const isExp = mode === 'explore', tier = MISSION_TIERS[m.tierIdx];
    const cats = m.catUids.map(u => state.ownedCats.find(c => c.uid === u)).filter(Boolean);
    const prev = calcMissionPreview(mode, m.tierIdx, m.catUids);
    const success = Math.random() * 100 < prev.chance;
    const names = cats.map(c => catDisplayName(c)).join('、') || '猫咪小队';
    let html = '';

    if (success) {
      const coins = prev.coinMin + Math.floor(Math.random() * (prev.coinMax - prev.coinMin + 1));
      state.coins += coins;
      cats.forEach(c => addAffection(c, tier.affWin));
      const gained = [];
      for (let i = 0; i < tier.matCount; i++) {
        const mat = T2_MATERIALS[Math.floor(Math.random() * T2_MATERIALS.length)];
        state.materials[mat.id] = (state.materials[mat.id] || 0) + 1; state.matDex[mat.id] = true;
        gained.push(`${mat.icon}${mat.name}`);
      }
      let bonusExp = 0;
      if (Math.random() < tier.rareChance) {
        const t3Pool = T3_MATERIALS.filter(x => x.drop === mode);
        const rMat = t3Pool[Math.floor(Math.random() * t3Pool.length)];
        state.materials[rMat.id] = (state.materials[rMat.id] || 0) + 1; state.matDex[rMat.id] = true;
        gained.push(`✨${rMat.icon}${rMat.name}`); bonusExp += 4 + tier.idx * 2;
      }
      let extra = '';
      if (isExp && Math.random() < 0.35 + tier.idx * 0.14) {
        const fPool = tier.idx >= 2 && Math.random() < 0.45 ? FOODS.filter(f => f.foodTier === 2) : FOODS.filter(f => !f.foodTier);
        const fd = fPool[Math.floor(Math.random() * fPool.length)];
        state.foods[fd.id] = (state.foods[fd.id] || 0) + 1; state.foodDex[fd.id] = true;
        extra += `<div>🍽️ 探索带回食物：<b>${fd.icon}${fd.name}</b> ×1</div>`;
      }
      if (Math.random() < tier.seedChance) {
        const sPool = FOODS.filter(f => f.kind === 'plant' && (tier.idx >= 2 || !f.rareSeed));
        const sd = sPool[Math.floor(Math.random() * sPool.length)];
        state.seeds[sd.id] = (state.seeds[sd.id] || 0) + 1;
        extra += `<div>🌱 发现植物种子：<b>${sd.icon}${sd.name}种子</b> ×1</div>`;
      }
      if (Math.random() < tier.bpChance) {
        const bps = FURNITURE_LIST.filter(f => f.source === mode && !state.unlockedBlueprints[f.id]);
        if (bps.length) {
          const bp = bps[Math.floor(Math.random() * bps.length)];
          state.unlockedBlueprints[bp.id] = true; bonusExp += 8;
          extra += `<div>📜 解锁专属图鉴：<b>${bp.name}图鉴</b>！</div>`;
        }
      }
      if (Math.random() < tier.buffChance) {
        const bf = BUFF_ITEMS[Math.floor(Math.random() * BUFF_ITEMS.length)];
        state.buffBag[bf.id] = (state.buffBag[bf.id] || 0) + 1;
        extra += `<div>🎁 顺手带回抽奖道具：<b>${bf.icon}${bf.name}</b> ×1</div>`;
      }
      const totalExp = prev.exp + bonusExp; gainExp(totalExp); SFX.rare(); vibrate(30);
      html = `<div class="quote-box">${isExp ? `${names} 深入【${m.targetName}】满载而归！` : `${names} 击败了【${m.targetName}】大获全胜！`}</div>
        <div class="stat-row" style="margin:8px 0;"><span class="stat-tag">🪙 +${coins}</span><span class="stat-tag exp">⭐ 经验+${totalExp}</span><span class="stat-tag fav">💕 好感+${tier.affWin}</span></div>
        <div style="font-size:12px;margin:6px 0;"><b>获得材料：</b>${gained.join('、')}</div>${extra}`;
    } else {
      const cExp = Math.max(4, Math.round(tier.exp * 0.25)), sCoins = Math.max(4, Math.round(tier.coinMin * 0.25));
      state.coins += sCoins; gainExp(cExp); cats.forEach(c => addAffection(c, -tier.affLose)); SFX.pop();
      const avgE = cats.reduce((s, c) => s + getEffectiveStats(c).explore, 0) / Math.max(1, cats.length);
      const avgP = cats.reduce((s, c) => s + getEffectiveStats(c).power, 0) / Math.max(1, cats.length);
      let reason = '';
      if (cats.some(c => c.catId === 'c_slacker') && cats.length === 1) reason = `终极躺平猫在门口晒了 ${tier.mins} 分钟太阳后滚回了家。`;
      else if (isExp) reason = avgE < tier.req ? `${names} 在【${m.targetName}】因探索值不足迷了路，顺着猫粮味摸回了家。` : `${names} 在【${m.targetName}】因武力值略低被松鼠抢先一步溜走了！`;
      else reason = avgP < tier.req ? `${names} 面对【${m.targetName}】时武力值不够，卖萌失败火速撤退！` : `${names} 与【${m.targetName}】激战时探索值略低没看清陷阱撤退了！`;
      html = `<div class="quote-box">${reason}</div>
        <div class="stat-row" style="margin:8px 0;"><span class="stat-tag">🪙 +${sCoins}</span><span class="stat-tag exp">⭐ +${cExp}</span><span class="stat-tag pwr">💔 好感-${tier.affLose}</span></div>`;
    }
    state.missions[mode] = null; saveState(); refreshAllUI(); renderMissionModal(mode);
    openDetailModal(success ? '🎉 凯旋归来！' : '🐾 意外小插曲', html);
  }

  function startTutorial(stepIdx = 0) {
    const step = TUTORIAL_STEPS[stepIdx];
    const isLast = stepIdx === TUTORIAL_STEPS.length - 1;
    openDetailModal(`🐱 新手向导 · ${step.title}`, `
      <div style="text-align:center;">
        ${renderCatSVG(CAT_CATALOG[8], 96)}
        <div class="quote-box" style="font-style:normal;color:var(--text);font-size:13px;line-height:1.6;">${step.text}</div>
        <div style="display:flex;justify-content:space-between;margin-top:12px;">
          <button class="tab-btn" id="tut-skip" type="button">跳过教程</button>
          <div style="display:flex;gap:6px;">
            ${stepIdx > 0 ? `<button class="tab-btn" id="tut-prev" type="button">上一步</button>` : ''}
            <button class="pill-btn pink" id="tut-next" type="button">${isLast ? '开始游玩！' : '下一步 →'}</button>
          </div>
        </div>
      </div>
    `);
    document.getElementById('tut-skip').addEventListener('click', () => { state.tutorialDone = true; saveState(); closeDetailModal(); });
    document.getElementById('tut-prev')?.addEventListener('click', () => startTutorial(stepIdx - 1));
    document.getElementById('tut-next').addEventListener('click', () => {
      if (isLast) { state.tutorialDone = true; saveState(); closeDetailModal(); }
      else startTutorial(stepIdx + 1);
    });
  }

  function updateGachaOnlyShowcase(res) {
    const box = document.getElementById('go-showcase');
    if (res) {
      if (res.type === 'cat') {
        const cat = CAT_MAP[res.catId];
        box.innerHTML = `<span class="${res.dot==='t4'?'rarity-dot t4-shimmer':(res.dot==='t3'?'rarity-dot shimmer':'rarity-dot')}" style="background:${DOT_COLORS[res.dot]};"></span>
          ${renderCatSVG(cat, 98)}<div style="font-size:14px;font-weight:800;">${cat.name}${res.isNew?' ✨NEW':''}</div>
          <div class="stat-row" style="margin:5px 0;"><span class="stat-tag pwr">武${cat.power}</span><span class="stat-tag exp">探${cat.explore}</span><span class="stat-tag chm">魅${cat.charm}</span></div>
          ${cat.quote ? `<div class="quote-box">“${cat.quote}”</div>` : ''}
          ${cat.tier === 4 ? `<div style="font-size:11px;color:#8E54C8;font-weight:700;">🔒 四级绝密猫已自动存入独立保险箱保护</div>` : `<button class="pill-btn pink" id="go-quick-sell" type="button" style="font-size:11px;padding:4px 10px;">🏪 寄送宠物店 (+${cat.sell}🪙)</button>`}`;
        document.getElementById('go-quick-sell')?.addEventListener('click', () => {
          if (sellCatToPetShop(res.uid)) { document.getElementById('go-quick-sell').disabled = true; document.getElementById('go-quick-sell').textContent = '已寄送'; updateHudNumbers(); }
        });
      } else if (res.type === 'bp') {
        box.innerHTML = `<span class="rarity-dot" style="background:${DOT_COLORS.bp};"></span>${renderFurnitureSVG(res.id, 86)}<div style="font-size:14px;font-weight:800;">${res.name}</div><div style="font-size:11px;color:var(--text-soft);">${res.desc}</div>`;
      } else {
        box.innerHTML = `<span class="rarity-dot" style="background:${DOT_COLORS[res.dot]};"></span><div style="font-size:50px;margin:6px 0;">${res.icon}</div><div style="font-size:14px;font-weight:800;">${res.name}</div><div style="font-size:11px;color:var(--text-soft);">${res.desc}</div>`;
      }
    }
    const qb = document.getElementById('go-quick-buffs');
    qb.innerHTML = BUFF_ITEMS.map(b => `<button class="tab-btn" data-gb="${b.id}" ${(state.buffBag[b.id]||0)<=0?'disabled':''}>${b.icon}${b.name.replace('✨','')} (${state.buffBag[b.id]||0})</button>`).join('');
    qb.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { activateBuff(b.dataset.gb); updateGachaOnlyShowcase(null); }));
    const hs = document.getElementById('go-history'); hs.innerHTML = '';
    state.gachaHistory.slice(0, 5).forEach(h => {
      const p = document.createElement('button'); p.className = 'hist-pill'; p.type = 'button';
      p.innerHTML = `${h.name}<span class="${h.dot==='t4'?'rarity-dot t4-shimmer':(h.dot==='t3'?'rarity-dot shimmer':'rarity-dot')}" style="width:7px;height:7px;top:6px;right:6px;background:${DOT_COLORS[h.dot]};"></span>`;
      p.addEventListener('click', () => openDrawResultDetail(h)); hs.appendChild(p);
    });
  }

  function activateBuff(id) {
    const it = BUFF_ITEMS.find(x => x.id === id);
    if (!it || (state.buffBag[id] || 0) <= 0) return;
    state.buffBag[id]--; state.activeBuffs[id] = Math.max(Date.now(), state.activeBuffs[id] || 0) + it.dur * 1000;
    SFX.rare(); saveState(); refreshAllUI(); showSysToast(`✨ 开启 ${it.name}（${it.dur}秒）！`);
  }

  function formatTime(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m > 0 ? `${m}分${String(s).padStart(2, '0')}秒` : `${s}秒`; }

  function updateHudNumbers() {
    const trPct = Math.round(getTrashRate() * 100), now = Date.now();
    document.getElementById('hud-level').textContent = `Lv.${state.level} (${state.exp}/${expNeeded(state.level)})`;
    document.getElementById('hud-exp-fill').style.width = `${Math.min(100, (state.exp / expNeeded(state.level)) * 100)}%`;
    document.getElementById('hud-coins').textContent = `🪙 ${state.coins}`;

  let sysToastTimer = null;
  function showSysToast(msg) {

  }

  function tick() {
    const now = Date.now(), interval = getGachaIntervalMs(), elapsed = now - state.gachaLastAt;
    if (elapsed >= interval) {
      const cycles = Math.floor(elapsed / interval);
      state.gachaLastAt = now - (elapsed % interval);
      triggerAutoDraws(cycles * (isBuffActive('cattreat') ? 2 : 1));
    }
    const remMs = Math.max(0, interval - (now - state.gachaLastAt));
    const pct = Math.min(100, ((interval - remMs) / interval) * 100);
    document.getElementById('mini-gacha-fill').style.width = pct + '%';
    document.getElementById('mini-gacha-sec').textContent = Math.ceil(remMs / 1000) + 's';
    document.getElementById('go-bar-fill').style.width = pct + '%';
    document.getElementById('go-timer-text').textContent = `距离下次自动出货还有 ${(remMs / 1000).toFixed(1)} 秒`;

    // Garden cats gain +0.5 affection every 10 minutes
    if (now - state.lastGardenAffAt >= 600000) {
      state.lastGardenAffAt = now;
      state.ownedCats.filter(c => c.inGarden && !isCatBusy(c.uid)).forEach(c => addAffection(c, 0.5));
      saveState();
    }
    if (now - state.lastPasserbyAt >= 28000) { state.lastPasserbyAt = now; spawnPasserby(); }
    maybeSpawnRaccoon();
    if (activeModal === 'explore' || activeModal === 'battle') {
      const m = state.missions[activeModal], cd = document.getElementById('mission-cd-text');
      if (m && cd) {
        const remS = Math.max(0, Math.ceil((m.endAt - now) / 1000));
        if (remS <= 0) renderMissionModal(activeModal);
        else cd.textContent = `倒计时：${formatTime(remS)}`;
      }
    }
    if (activeModal === 'farm') renderFarmModal();
    updateHudNumbers();
  }

  function makeCardUnit(oc, isEnemy = false, diffMul = 1) {
    if (isEnemy) {

      const chm = Math.min(100, Math.round((35 + Math.random() * 45) * diffMul));
      return {
        id: 'en_' + Math.random().toString(36).slice(2, 7),
        name: names[Math.floor(Math.random() * names.length)],
        hp: 10, maxHp: 10, shield: 0,
        atk: Number((1.5 + (pwr / 100) * 2.1).toFixed(1)),
        defPct: Math.min(70, Math.round(exp * 0.45)),
        skDmg: Number((3.4 + (chm / 100) * 3.4).toFixed(1)),
        dodge: 0, crit: 0, extraSkill: null, sp: 0
      };
    }
    const st = getEffectiveStats(oc);
    return {
      uid: oc.uid, catId: oc.catId, name: catDisplayName(oc),
      hp: 10, maxHp: 10, shield: 0,
      atk: Number((1.5 + (st.power / 100) * 2.1).toFixed(1)),

      skDmg: Number((3.5 + (st.charm / 100) * 3.5).toFixed(1)),
      dodge: 0, crit: 0, extraSkill: null
    };
  }

      cb.myTeam = cb.pick3Uids.map(u => makeCardUnit(state.ownedCats.find(c => c.uid === u), false));
      cb.buffPool6 = [...CB_ENHANCEMENTS].sort(() => Math.random() - 0.5).slice(0, 6);
      cb.buffStep = 0; cb.pendingBuff = null; cb.sp = 0; cb.bonusSpChance = 0;
      cb.phase = 'draftBuff';
      renderCardBattleModal();
    });
    const g = document.getElementById('cb-p3-grid');
    cb.deck5.forEach(uid => {
      const oc = state.ownedCats.find(c => c.uid === uid), u = makeCardUnit(oc, false);
      const used = cb.uses[uid] || 0, exhausted = used >= 2, sel = cb.pick3Uids.includes(uid);
      const card = document.createElement('div'); card.className = 'item-card' + (sel ? ' selected' : '');
      card.style.opacity = exhausted ? '0.42' : '1'; card.style.cursor = exhausted ? 'not-allowed' : 'pointer';
      card.innerHTML = `${renderCatSVG(CAT_MAP[oc.catId], 48)}<div style="font-size:11px;font-weight:800;">${u.name}</div>
        <div class="stat-row"><span class="stat-tag pwr">攻${u.atk}</span><span class="stat-tag exp">防${u.defPct}%</span><span class="stat-tag chm">技${u.skDmg}</span></div>
        <div style="font-size:10px;color:${exhausted?'#C7644B':'var(--text-soft)'};">剩余出战：${2-used}/2</div>`;
      if (!exhausted) card.addEventListener('click', () => {
        if (sel) cb.pick3Uids = cb.pick3Uids.filter(x => x !== uid);
        else if (cb.pick3Uids.length < 3) cb.pick3Uids.push(uid);
        SFX.pop(); renderCardBattleModal();
      });
      g.appendChild(card);
    });
  }

  function renderCbDraftBuff(body) {
    const trio = cb.buffPool6.slice(cb.buffStep * 3, cb.buffStep * 3 + 3);
    if (cb.pendingBuff) {
      const b = cb.pendingBuff;
      body.innerHTML = `
        <div style="font-size:13px;font-weight:800;margin-bottom:8px;">选择要赋予【${b.name}】的己方猫咪：</div>
        <div class="cb-row">
          ${cb.myTeam.map((m, idx) => `<div class="cb-card" data-tm="${idx}">
            <div style="display:flex;justify-content:center;">${renderCatSVG(CAT_MAP[m.catId], 52)}</div>
            <div style="font-size:12px;font-weight:800;">${m.name}</div>
            <div style="font-size:10px;color:var(--text-soft);">攻${m.atk} 防${m.defPct}% 技${m.skDmg}</div>
          </div>`).join('')}
        </div>
      `;
      body.querySelectorAll('[data-tm]').forEach(el => el.addEventListener('click', () => {
        applyCbBuff(b, Number(el.dataset.tm));
        cb.pendingBuff = null;
        advanceCbBuffStep();
      }));
      return;
    }
    body.innerHTML = `
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;">🃏 第 ${cb.buffStep+1}/2 次强化卡 3 选 1（从 54 种卡池随机抽取 6 张）：</div>
      <div class="cb-row">
        ${trio.map((b, i) => `<div class="cb-card" data-bi="${i}" style="padding:12px 8px;">
          <div style="font-size:24px;">${b.kind==='skill'?'✨':(b.kind==='single'?'🐾':'🌟')}</div>
          <div style="font-size:12px;font-weight:800;margin:4px 0;">${b.name}</div>
          <div style="font-size:11px;color:var(--text-soft);line-height:1.45;">${b.desc}</div>
        </div>`).join('')}
      </div>
    `;
    body.querySelectorAll('[data-bi]').forEach(el => el.addEventListener('click', () => {
      const chosen = trio[Number(el.dataset.bi)];
      SFX.pop();
      if (chosen.kind === 'team') { applyCbBuff(chosen, -1); advanceCbBuffStep(); }
      else { cb.pendingBuff = chosen; renderCardBattleModal(); }
    }));
  }

  function applyCbBuff(b, allyIdx) {
    if (b.kind === 'skill') { cb.myTeam[allyIdx].extraSkill = b; return; }
    if (b.kind === 'single') {
      const m = cb.myTeam[allyIdx];
      if (b.stat === 'atk') m.atk = Number((m.atk + b.val).toFixed(1));
      if (b.stat === 'def') m.defPct = Math.min(72, m.defPct + b.val);
      if (b.stat === 'skDmg') m.skDmg = Number((m.skDmg + b.val).toFixed(1));
      if (b.stat === 'dodge') m.dodge = Math.min(60, m.dodge + b.val);
      if (b.stat === 'initShield') m.shield = Number((m.shield + b.val).toFixed(1));
      return;
    }
    if (b.stat === 'sp') cb.sp = Math.min(3, cb.sp + b.val);
    if (b.stat === 'bonusSpChance') cb.bonusSpChance += b.val;
    if (b.stat === 'teamAtk') cb.myTeam.forEach(m => m.atk = Number((m.atk + b.val).toFixed(1)));
    if (b.stat === 'teamDef') cb.myTeam.forEach(m => m.defPct = Math.min(72, m.defPct + b.val));
    if (b.stat === 'teamSk') cb.myTeam.forEach(m => m.skDmg = Number((m.skDmg + b.val).toFixed(1)));
    if (b.stat === 'teamDodge') cb.myTeam.forEach(m => m.dodge = Math.min(60, m.dodge + b.val));
    if (b.stat === 'teamInitShield') cb.myTeam.forEach(m => m.shield = Number((m.shield + b.val).toFixed(1)));
    if (b.stat === 'teamCrit') cb.myTeam.forEach(m => m.crit += b.val);
    if (b.stat === 'teamMaxHp') cb.myTeam.forEach(m => { m.maxHp = Number((m.maxHp + b.val).toFixed(1)); m.hp = m.maxHp; });
    if (b.stat === 'enemyAtkDown') cb.enemies.forEach(e => e.atk = Number(Math.max(0.8, e.atk * (1 - b.val/100)).toFixed(1)));
    if (b.stat === 'enemyDefDown') cb.enemies.forEach(e => e.defPct = Math.max(0, e.defPct - b.val));
    if (b.stat === 'enemyInitDmg') cb.enemies.forEach(e => e.hp = Number(Math.max(0.5, e.hp - b.val).toFixed(1)));
    if (b.stat === 'mixAtkDef') cb.myTeam.forEach(m => { m.atk = Number((m.atk+0.6).toFixed(1)); m.defPct = Math.min(72, m.defPct+8); });
    if (b.stat === 'mixSkEv') cb.myTeam.forEach(m => { m.skDmg = Number((m.skDmg+1.0).toFixed(1)); m.dodge = Math.min(60, m.dodge+10); });
    if (b.stat === 'mixDefSh') cb.myTeam.forEach(m => { m.defPct = Math.min(72, m.defPct+10); m.shield = Number((m.shield+1.8).toFixed(1)); });
    if (b.stat === 'mixAll') cb.myTeam.forEach(m => { m.atk = Number((m.atk+0.5).toFixed(1)); m.defPct = Math.min(72, m.defPct+8); m.skDmg = Number((m.skDmg+0.8).toFixed(1)); });
  }

  function advanceCbBuffStep() {
    cb.buffStep++;
    if (cb.buffStep >= 2) {
      cb.phase = 'fight';
      cb.selectedAlly = 0; cb.selectedEnemy = 0; cb.lastActedAlly = -1;
      cb.log = [`第 ${cb.round} 回合开始！自由点选我方任意猫咪出击吧～`];
    }
    renderCardBattleModal();
  }

  function dealDamage(target, rawDmg, ignoreDef = false) {
    if (target.dodge > 0 && Math.random() * 100 < target.dodge) return { dodged: true, dmg: 0 };
    let dmg = ignoreDef ? rawDmg : rawDmg * (1 - target.defPct / 100);
    dmg = Math.max(0.5, Number(dmg.toFixed(1)));
    if (target.shield > 0) {
      const absorb = Math.min(target.shield, dmg);
      target.shield = Number((target.shield - absorb).toFixed(1));
      dmg = Number((dmg - absorb).toFixed(1));
    }
    target.hp = Number(Math.max(0, target.hp - dmg).toFixed(1));
    return { dodged: false, dmg };
  }

  function isAllyOnCooldown(idx) {
    const aliveCount = cb.myTeam.filter(m => m.hp > 0).length;
    return aliveCount > 1 && idx === cb.lastActedAlly;
  }

  function renderCbFight(body) {
    if (cb.myTeam[cb.selectedAlly].hp <= 0 || isAllyOnCooldown(cb.selectedAlly)) {
      const nextIdx = cb.myTeam.findIndex((m, i) => m.hp > 0 && !isAllyOnCooldown(i));
      cb.selectedAlly = nextIdx !== -1 ? nextIdx : Math.max(0, cb.myTeam.findIndex(m => m.hp > 0));
    }
    if (cb.enemies[cb.selectedEnemy].hp <= 0) cb.selectedEnemy = Math.max(0, cb.enemies.findIndex(e => e.hp > 0));
    const curAlly = cb.myTeam[cb.selectedAlly];
    const stars = '⭐'.repeat(cb.sp) + '☆'.repeat(3 - cb.sp);

    body.innerHTML = `<div class="cb-arena">
      <div class="cb-row">
        ${cb.enemies.map((e, i) => `<div class="cb-card ${i===cb.selectedEnemy?'target-pick':''} ${e.hp<=0?'ko':''}" data-en="${i}">
          <div style="font-size:20px;">😼</div><div style="font-size:11px;font-weight:800;">${e.name}</div>
          <div class="cb-hp-bar"><div class="cb-hp-fill" style="width:${(e.hp/e.maxHp)*100}%;"></div></div>
          <div style="font-size:10px;">HP ${e.hp}/${e.maxHp} · 蓄能${e.sp}/3</div>
          <div style="font-size:10px;color:var(--text-soft);">攻${e.atk} 防${e.defPct}% 技${e.skDmg}</div>
          ${e.hp<=0?'<div class="cb-ko-stamp">退场喝奶茶啦</div>':''}
        </div>`).join('')}
      </div>

      <div class="cb-sp-bar">
        <span>第 ${cb.round}/3 回合（${cb.myWins}:${cb.enWins}）</span>
        <span>技能点：<b>${stars} (${cb.sp}/3)</b></span>
      </div>
      <div class="cb-log">${cb.log.slice(0, 4).join('<br>')}</div>

      <div class="cb-row">
        ${cb.myTeam.map((m, i) => {
          const rested = m.hp > 0 && isAllyOnCooldown(i);
          return `<div class="cb-card ${i===cb.selectedAlly?'active-pick':''} ${m.hp<=0?'ko':''}" data-al="${i}" style="${rested?'opacity:0.62;cursor:not-allowed;':''}">
          <div style="display:flex;justify-content:center;">${renderCatSVG(CAT_MAP[m.catId], 44)}</div>
          <div style="font-size:11px;font-weight:800;">${m.name}</div>
          <div class="cb-hp-bar"><div class="cb-hp-fill" style="width:${(m.hp/m.maxHp)*100}%;background:linear-gradient(90deg,#62C3A0,#4BA8A4);"></div></div>
          <div style="font-size:10px;">HP ${m.hp}/${m.maxHp}${m.shield>0?` 🛡️${m.shield}`:''}</div>
          <div style="font-size:10px;color:var(--text-soft);">攻${m.atk} 防${m.defPct}% 技${m.skDmg}</div>
          ${rested?'<div style="font-size:10px;color:#B86B4B;font-weight:700;margin-top:2px;">💤 刚出过招，换只猫</div>':''}
          ${m.hp<=0?'<div class="cb-ko-stamp">退场喝奶茶啦</div>':''}
        </div>`;
        }).join('')}
      </div>

      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
        <button class="pill-btn mint" id="cb-act-atk" type="button">🐾 普通攻击 (+1⭐)</button>
        <button class="pill-btn pink" id="cb-act-sk" type="button" ${cb.sp>=3?'':'disabled'}>✨ 专属技能 (耗3⭐ · 伤${curAlly.skDmg})</button>
        ${curAlly.extraSkill ? `<button class="pill-btn blue" id="cb-act-ex" type="button" ${cb.sp>=3?'':'disabled'}>🃏 ${curAlly.extraSkill.name} (耗3⭐)</button>` : ''}
      </div>
    </div>`;

    body.querySelectorAll('[data-en]').forEach(el => el.addEventListener('click', () => {
      const idx = Number(el.dataset.en); if (cb.enemies[idx].hp > 0) { cb.selectedEnemy = idx; renderCardBattleModal(); }
    }));
    body.querySelectorAll('[data-al]').forEach(el => el.addEventListener('click', () => {
      const idx = Number(el.dataset.al); if (cb.myTeam[idx].hp > 0 && !isAllyOnCooldown(idx)) { cb.selectedAlly = idx; renderCardBattleModal(); } else if (isAllyOnCooldown(idx)) { showSysToast('不能连续两次用同一只猫出招，换一只猫吧～'); }
    }));
    document.getElementById('cb-act-atk').addEventListener('click', () => executeCbTurn('atk'));
    document.getElementById('cb-act-sk').addEventListener('click', () => executeCbTurn('skill'));
    document.getElementById('cb-act-ex')?.addEventListener('click', () => executeCbTurn('extra'));
  }

  function executeCbTurn(actType) {
    const ally = cb.myTeam[cb.selectedAlly], enemy = cb.enemies[cb.selectedEnemy];
    if (!ally || ally.hp <= 0 || !enemy || enemy.hp <= 0 || isAllyOnCooldown(cb.selectedAlly)) return;
    cb.lastActedAlly = cb.selectedAlly;
    const critMul = (ally.crit > 0 && Math.random() * 100 < ally.crit) ? 1.5 : 1;

    if (actType === 'atk') {
      const res = dealDamage(enemy, ally.atk * critMul);
      cb.sp = Math.min(3, cb.sp + 1 + (cb.bonusSpChance > 0 && Math.random() * 100 < cb.bonusSpChance ? 1 : 0));
      cb.log.unshift(`🐾 ${ally.name} 普攻 ${enemy.name}${critMul>1?'【暴击】':''}，造成 ${res.dmg} 伤害！（技能点 ${cb.sp}/3）`);
      SFX.pop();
    } else if (actType === 'skill') {
      if (cb.sp < 3) return;
      cb.sp -= 3;
      const res = dealDamage(enemy, ally.skDmg * critMul);
      cb.log.unshift(`✨ ${ally.name} 释放大招命中 ${enemy.name}，造成 ${res.dmg} 高额伤害！`);
      SFX.rare();
    } else if (actType === 'extra') {
      if (cb.sp < 3 || !ally.extraSkill) return;
      cb.sp -= 3;
      const sk = ally.extraSkill;
      if (sk.skType === 'aoe') {
        cb.enemies.filter(e => e.hp > 0).forEach(e => dealDamage(e, sk.val * critMul));
        cb.log.unshift(`🌪️ ${ally.name} 发动【${sk.name}】，横扫敌方全员！`);
      } else if (sk.skType === 'shield') {
        ally.shield = Number((ally.shield + sk.val).toFixed(1));
        cb.log.unshift(`🛡️ ${ally.name} 套上了 ${sk.val} 点厚实护盾！`);
      } else if (sk.skType === 'teamShield') {
        cb.myTeam.filter(m => m.hp > 0).forEach(m => m.shield = Number((m.shield + sk.val).toFixed(1)));
        cb.log.unshift(`🛡️ ${ally.name} 为我方全员套上 ${sk.val} 护盾！`);
      } else if (sk.skType === 'heal') {
        ally.hp = Number(Math.min(ally.maxHp, ally.hp + sk.val).toFixed(1));
        cb.log.unshift(`💚 ${ally.name} 发动治愈呼噜，回复 ${sk.val} 血量！`);
      } else if (sk.skType === 'teamHeal') {
        cb.myTeam.filter(m => m.hp > 0).forEach(m => m.hp = Number(Math.min(m.maxHp, m.hp + sk.val).toFixed(1)));
        cb.log.unshift(`💚 ${ally.name} 为全队回复 ${sk.val} 血量！`);
      } else if (sk.skType === 'pierce') {
        const res = dealDamage(enemy, sk.val * critMul, true);
        cb.log.unshift(`⚡ ${ally.name} 破甲突刺无视防御，对 ${enemy.name} 造成 ${res.dmg} 伤害！`);
      } else if (sk.skType === 'double') {
        const r1 = dealDamage(enemy, ally.atk * 1.15); const r2 = dealDamage(enemy, ally.atk * 1.15);
        cb.log.unshift(`🥊 ${ally.name} 肉垫二连击，共造成 ${(r1.dmg+r2.dmg).toFixed(1)} 伤害！`);
      } else if (sk.skType === 'drain') {
        const res = dealDamage(enemy, sk.val); ally.hp = Number(Math.min(ally.maxHp, ally.hp + res.dmg * 0.5).toFixed(1));
        cb.log.unshift(`🐟 ${ally.name} 吸取能量造成 ${res.dmg} 伤害并回复自身血量！`);
      } else if (sk.skType === 'weaken') {
        const res = dealDamage(enemy, sk.val); cb.enemies.forEach(e => e.atk = Number(Math.max(0.8, e.atk * 0.75).toFixed(1)));
        cb.log.unshift(`💫 ${ally.name} 震慑全场造成 ${res.dmg} 伤害并降低敌方攻击！`);
      }
      SFX.rare();
    }

    // Check round win
    if (cb.enemies.every(e => e.hp <= 0)) { finishCbRound(true); return; }

    // Enemy counter-attack
    const aliveEn = cb.enemies.filter(e => e.hp > 0);
    const aliveMy = cb.myTeam.filter(m => m.hp > 0);
    const attacker = aliveEn[Math.floor(Math.random() * aliveEn.length)];
    const target = aliveMy[Math.floor(Math.random() * aliveMy.length)];
    let res;
    if (attacker.sp >= 3) {
      attacker.sp = 0;
      res = dealDamage(target, attacker.skDmg);
      cb.log.unshift(res.dodged ? `💨 ${target.name} 灵活闪避了 ${attacker.name} 的大招！` : `💥 ${attacker.name} 放技能命中 ${target.name}，造成 ${res.dmg} 伤害！`);
    } else {
      attacker.sp++;
      res = dealDamage(target, attacker.atk);
      cb.log.unshift(res.dodged ? `💨 ${target.name} 漂亮闪避了 ${attacker.name} 的攻击！` : `😾 ${attacker.name} 反击 ${target.name}，造成 ${res.dmg} 伤害。`);
    }

    if (cb.myTeam.every(m => m.hp <= 0)) { finishCbRound(false); return; }
    renderCardBattleModal();
  }

  function finishCbRound(won) {
    if (won) cb.myWins++; else cb.enWins++;
    if (cb.myWins >= 2 || cb.enWins >= 2 || cb.round >= 3) {
      const victory = cb.myWins > cb.enWins;
      const mode = cb.mode;
      cb = null;
      const rewards = [];
      if (victory) {
        SFX.rare(); vibrate(40);
        const t3Cnt = mode === 'pro' ? 3 : 2;
        const f2Cnt = mode === 'pro' ? 3 : 2;
        for (let i = 0; i < t3Cnt; i++) {
          const m3 = T3_MATERIALS[Math.floor(Math.random() * T3_MATERIALS.length)];
          state.materials[m3.id] = (state.materials[m3.id] || 0) + 1; state.matDex[m3.id] = true;
          rewards.push(`${m3.icon}${m3.name}`);
        }
        for (let i = 0; i < f2Cnt; i++) {
          const f2s = FOODS.filter(f => f.foodTier === 2);
          const f2 = f2s[Math.floor(Math.random() * f2s.length)];
          state.foods[f2.id] = (state.foods[f2.id] || 0) + 1; state.foodDex[f2.id] = true;
          rewards.push(`${f2.icon}${f2.name}`);
        }
        // Exclusive Card-Battle Rewards (cannot be obtained anywhere else!)
        const exDrops = mode === 'pro' ? 2 : 1;
        for (let k = 0; k < exDrops; k++) {
          const roll = Math.random();
          if (roll < 0.30) {
            state.buffBag.cb_bell = (state.buffBag.cb_bell || 0) + 1;
            rewards.push('🌟至尊寻猫铃 (卡牌专属!)');
          } else if (roll < 0.55) {
            const exEq = Math.random() < 0.5 ? 'eq_cbcape' : 'wp_cbglove';
            state.equipBag[exEq] = (state.equipBag[exEq] || 0) + 1;
            const eqMeta = EQUIP_ITEMS.find(x => x.id === exEq);
            rewards.push(`${eqMeta.icon}${eqMeta.name} (卡牌专属!)`);
          } else if (roll < 0.78 && !state.unlockedBlueprints.f_cbarena) {
            state.unlockedBlueprints.f_cbarena = true;
            rewards.push('📜喵喵决斗擂台图鉴 (卡牌专属!)');
          } else {
            const lockedBp = FURNITURE_LIST.filter(f => f.source !== 'shopDirect' && !state.unlockedBlueprints[f.id]);
            if (lockedBp.length) {
              const bp = lockedBp[Math.floor(Math.random() * lockedBp.length)];
              state.unlockedBlueprints[bp.id] = true;
              rewards.push(`📜${bp.name}图鉴`);
            } else {
              state.buffBag.cb_bell = (state.buffBag.cb_bell || 0) + 1;
              rewards.push('🌟至尊寻猫铃 (卡牌专属!)');
            }
          }
        }
        gainExp(mode === 'pro' ? 60 : 35);
        saveState(); refreshAllUI();
        openDetailModal('🏆 卡牌对决大获全胜！', `<div style="text-align:center;line-height:1.8;">所有猫咪毫发无伤地凯旋归来！<br>获得零金币高阶大礼包：<div class="quote-box" style="font-style:normal;">${rewards.join('、')}</div></div>`);
      } else {
        const m2 = T2_MATERIALS[Math.floor(Math.random() * T2_MATERIALS.length)];
        state.materials[m2.id] = (state.materials[m2.id] || 0) + 1; state.matDex[m2.id] = true;
        gainExp(10); saveState(); refreshAllUI();
        openDetailModal('🐾 友谊赛惜败', `<div style="text-align:center;line-height:1.8;">小猫们喝完奶茶平安回庭院啦（零伤害、不扣好感）！<br>获得纪念安慰奖：${m2.icon}${m2.name} ×1、经验 +10</div>`);
      }
      renderCardBattleModal();
      return;
    }
    cb.round++;
    showSysToast(won ? `🎉 拿下第 ${cb.round-1} 回合！准备下一回合` : `🐾 第 ${cb.round-1} 回合惜败，调整阵容反击！`);
    prepareCbRound();
  }

  function bindEvents() {
    document.getElementById('hud-level').addEventListener('click', () => showSysToast(`当前 Lv.${state.level}（经验 ${state.exp}/${expNeeded(state.level)}）：完成探索、战斗或卡牌对决即可获得经验升级！`));
    document.getElementById('btn-dex').addEventListener('click', () => openModal('dex', '📖 收集图鉴', 'cats'));
    document.getElementById('btn-warehouse').addEventListener('click', () => openModal('warehouse', '🏠 我的仓库', 'cats'));
    document.getElementById('btn-explore').addEventListener('click', () => openModal('explore', '🧭 派遣探索'));
    document.getElementById('btn-battle').addEventListener('click', () => openModal('battle', '⚔️ 派遣战斗'));
    document.getElementById('btn-shop').addEventListener('click', () => openModal('shop', '🛍️ 软萌商店', 'buffs'));
    document.getElementById('yard-farm-zone').addEventListener('click', () => openModal('farm', '🌱 猫咪安全小菜园'));
    document.getElementById('btn-card-battle').addEventListener('click', openCardBattleModal);
    document.getElementById('btn-workshop').addEventListener('click', () => openModal('workshop', '♻️ 三阶合成工坊', 't1'));
    document.getElementById('btn-garden-build').addEventListener('click', () => openModal('gardenBuild', '🏡 庭院家具装修'));
    document.getElementById('btn-garden-cats').addEventListener('click', () => openModal('gardenCats', '🐾 庭院管理'));
    document.getElementById('btn-settings').addEventListener('click', () => openModal('settings', '⚙️ 详细设置与背景'));

    document.getElementById('btn-edit-toggle').addEventListener('click', () => {
      editMode = !editMode; selectedPlacedId = null; SFX.pop(); renderGarden();
      showSysToast(editMode ? '自由摆放已开启：拖动家具调整位置' : '已退出自由摆放');
    });
    const toggleGacha = (show) => { document.getElementById('gacha-only-view').classList.toggle('active', show); if (show) updateGachaOnlyShowcase(state.gachaHistory[0] || null); SFX.pop(); };
    document.getElementById('btn-gacha-mode').addEventListener('click', () => toggleGacha(true));
    document.getElementById('mini-gacha-pill').addEventListener('click', () => toggleGacha(true));
    document.getElementById('btn-exit-gacha-mode').addEventListener('click', () => toggleGacha(false));

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') closeModal(); });
    document.getElementById('detail-close').addEventListener('click', closeDetailModal);
    document.getElementById('detail-backdrop').addEventListener('click', (e) => { if (e.target.id === 'detail-backdrop') closeDetailModal(); });

    document.getElementById('ft-flip').addEventListener('click', () => { const pf = state.placedFurniture.find(x => x.pid === selectedPlacedId); if (pf) { pf.flipped = !pf.flipped; saveState(); renderGarden(); positionFurnToolbar(pf); } });
    document.getElementById('ft-front').addEventListener('click', () => { const pf = state.placedFurniture.find(x => x.pid === selectedPlacedId); if (pf) { pf.zOffset = Math.min(50, (pf.zOffset || 0) + 10); saveState(); renderGarden(); positionFurnToolbar(pf); } });
    document.getElementById('ft-back').addEventListener('click', () => { const pf = state.placedFurniture.find(x => x.pid === selectedPlacedId); if (pf) { pf.zOffset = Math.max(-50, (pf.zOffset || 0) - 10); saveState(); renderGarden(); positionFurnToolbar(pf); } });
    document.getElementById('ft-remove').addEventListener('click', () => {
      const idx = state.placedFurniture.findIndex(x => x.pid === selectedPlacedId);
      if (idx !== -1) { const pf = state.placedFurniture.splice(idx, 1)[0]; state.ownedFurniture[pf.furnId] = (state.ownedFurniture[pf.furnId] || 0) + 1; selectedPlacedId = null; hideFurnToolbar(); saveState(); renderGarden(); showSysToast('家具已收回仓库'); }
    });
    document.getElementById('garden-stage').addEventListener('click', () => { selectedPlacedId = null; hideFurnToolbar(); renderGarden(); });

    // Free Custom Background Upload with lightweight canvas compression
    document.getElementById('bg-file-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 1200, scale = Math.min(1, maxW / img.width);
          canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          state.settings.customBgData = canvas.toDataURL('image/jpeg', 0.78);
          state.settings.bgTheme = 'bg-custom';
          applyBackgroundAndUI(); saveState();
          if (activeModal === 'settings') renderSettingsModal();
          showSysToast('自定义背景已更换！');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    document.getElementById('save-file-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !Array.isArray(parsed.ownedCats)) throw new Error();
          state = { ...createInitialState(), ...parsed }; saveState(); refreshAllUI(); closeModal(); showSysToast('存档文件读取成功！');
        } catch { showSysToast('存档文件格式无效'); }
      };
      reader.readAsText(file); e.target.value = '';
    });

    window.addEventListener('resize', () => { if (state.settings.uiMode === 'auto') applyBackgroundAndUI(); });
    const gvScroll = document.getElementById('garden-view');
    document.getElementById('pan-left').addEventListener('click', () => gvScroll.scrollBy({ left: -280, behavior: 'smooth' }));
    document.getElementById('pan-right').addEventListener('click', () => gvScroll.scrollBy({ left: 280, behavior: 'smooth' }));
    // Smooth mouse drag-to-pan on desktop (touch already scrolls natively!)
    let panDown = false, panStartX = 0, panStartScroll = 0;
    gvScroll.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch' || e.target.closest('.yard-item, .yard-cat, #cat-tree-widget, button')) return;
      panDown = true; panStartX = e.clientX; panStartScroll = gvScroll.scrollLeft;
    });
    window.addEventListener('pointermove', (e) => {
      if (!panDown) return;
      gvScroll.scrollLeft = panStartScroll - (e.clientX - panStartX);
    });
    window.addEventListener('pointerup', () => { panDown = false; });
  }

  window.addEventListener('load', () => {
    SFX.enabled = state.settings.soundOn;
    SFX.volume = (state.settings.volume ?? 70) / 100;
    bindEvents();
    refreshAllUI();
    if (!state.tutorialDone) setTimeout(() => startTutorial(0), 400);
    setInterval(tick, 500);
    setInterval(() => {
      if (editMode) return;
      document.querySelectorAll('.yard-cat:not(.resting)').forEach(node => {
        if (Math.random() > 0.45) return;
        const oc = state.ownedCats.find(c => c.uid === node.dataset.uid); if (!oc) return;
        oc.gx = Math.max(10, Math.min(88, (oc.gx || 50) + (Math.random() * 26 - 13)));
        oc.gy = Math.max(24, Math.min(86, (oc.gy || 55) + (Math.random() * 16 - 8)));
        node.style.left = oc.gx + '%'; node.style.top = oc.gy + '%'; node.style.zIndex = Math.round(oc.gy * 2) + 2;
      });
    }, 3200);
    const gvInit = document.getElementById('garden-view');
    gvInit.scrollLeft = Math.max(0, (getGardenWidth() - window.innerWidth) * 0.5);
    setTimeout(spawnPasserby, 5000);
  });
})();
</script>
</body>
</html>
